<!-- The Library page: the system recomposing from a page to a tool as the
     hero, then the patterns and components (the build inserts the lists). -->
<section class="showcase" aria-label="The system, from page to tool">
  <div class="showcase-screens" id="showcase-screens">
    <div class="segmented showcase-device" role="group" aria-label="Screen" id="showcase-device">
      <span class="segmented-indicator" aria-hidden="true"></span>
      <button class="segmented-option t-control is-active" type="button" aria-pressed="true" value="phone">Phone</button>
      <button class="segmented-option t-control" type="button" aria-pressed="false" value="desktop">Desktop</button>
    </div>
    <div class="screen-box is-desktop-box" aria-hidden="true"><div class="screen is-desktop" data-size="desktop"></div></div>
    <div class="screen-box is-phone-box" aria-hidden="true"><div class="screen is-phone" data-size="phone"></div></div>
  </div>
  <div class="showcase-steps">
    <div class="showcase-scale">
      <div class="segmented" role="group" aria-label="Step" id="showcase-steps">
        <span class="segmented-indicator" aria-hidden="true"></span>
        <button class="segmented-option t-control is-active" type="button" aria-pressed="true" value="0">Object</button>
        <button class="segmented-option t-control" type="button" aria-pressed="false" value="1">Text</button>
        <button class="segmented-option t-control" type="button" aria-pressed="false" value="2">Media</button>
        <button class="segmented-option t-control" type="button" aria-pressed="false" value="3">Chart</button>
        <button class="segmented-option t-control" type="button" aria-pressed="false" value="4">Tool</button>
      </div>
      <div class="showcase-ends"><span class="t-mono">Expressive</span><span class="t-mono">Tool</span></div>
    </div>
  </div>
</section>
