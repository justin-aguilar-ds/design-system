<div style="display: grid; justify-items: start; gap: 8px">
  <span class="picker-trigger button surface surface--rest surface--pill t-control">
    <span class="picker-value">Last 7 days</span>
    <span style="display: inline-flex; transform: rotate(180deg)"><svg class="picker-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </span>
  <div class="picker-menu" style="position: static; transform: none; opacity: 1">
    <ul class="picker-list">
      <li class="picker-option t-control">Today</li>
      <li class="picker-option t-control is-indicated" aria-selected="true" style="background: var(--color-fill-subtle)">Last 7 days</li>
      <li class="picker-option t-control">Last 30 days</li>
    </ul>
  </div>
</div>
