<!-- personal-styling · picker · v0.1.0 -->
<div class="picker-field">
  <span class="t-label" id="sort-label">Sort by</span>
  <div class="picker">
    <button class="picker-trigger button surface surface--rest surface--pill t-control" type="button"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="sort-list"
            aria-labelledby="sort-label sort-value">
      <span class="picker-value" id="sort-value">Most recent</span>
      <svg class="picker-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="picker-menu" hidden>
      <ul class="picker-list" id="sort-list" role="listbox" tabindex="-1" aria-labelledby="sort-label">
        <li class="picker-option t-control" role="option" aria-selected="true" data-value="recent">Most recent</li>
        <li class="picker-option t-control" role="option" aria-selected="false" data-value="oldest">Oldest first</li>
        <li class="picker-option t-control" role="option" aria-selected="false" data-value="name">Name</li>
        <li class="picker-option t-control" role="option" aria-selected="false" data-value="size">Largest first</li>
        <li class="picker-option t-control" role="option" aria-selected="false" aria-disabled="true" data-value="relevance">Relevance</li>
      </ul>
    </div>
    <input type="hidden" name="sort" value="recent">
  </div>
</div>
