<div class="demo-grid">
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Rest — hover an option to preview it</p>
    <div class="segmented" role="group" aria-label="Rest">
      <span class="segmented-indicator" aria-hidden="true"></span>
      <button class="segmented-option is-active t-control" type="button" aria-pressed="true">Total</button>
      <button class="segmented-option t-control" type="button" aria-pressed="false">Per game</button>
      <button class="segmented-option t-control" type="button" aria-pressed="false">Per minute</button>
    </div>
  </div>
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Hover — the frame lifts</p>
    <div class="segmented force-hover" role="group" aria-label="Hover">
      <span class="segmented-indicator" aria-hidden="true"></span>
      <button class="segmented-option is-active t-control" type="button" aria-pressed="true">Total</button>
      <button class="segmented-option t-control" type="button" aria-pressed="false">Per game</button>
      <button class="segmented-option t-control" type="button" aria-pressed="false">Per minute</button>
    </div>
  </div>
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Page nav, next to a Label button for scale</p>
    <div class="button-row">
      <nav class="segmented segmented--nav" aria-label="Pages">
        <span class="segmented-indicator" aria-hidden="true"></span>
        <a class="segmented-option is-active t-label" href="#" aria-current="page">Overview</a>
        <a class="segmented-option t-label" href="#">Activity</a>
      </nav>
      <button class="button surface surface--rest surface--pill t-label" type="button">Save changes</button>
    </div>
  </div>
</div>
