<div class="demo-grid">
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Rest</p>
    <span class="slider" style="--slider-pct: 0.4">
      <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
      <input class="slider-input" type="range" min="0" max="100" value="40" aria-label="Rest">
    </span>
  </div>
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Hover — the fill previews at 30%</p>
    <span class="slider force-hover" style="--slider-pct: 0.4">
      <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
      <input class="slider-input" type="range" min="0" max="100" value="40" aria-label="Hover">
    </span>
  </div>
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Dragging</p>
    <span class="slider is-active" style="--slider-pct: 0.4">
      <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
      <input class="slider-input" type="range" min="0" max="100" value="40" aria-label="Dragging">
    </span>
  </div>
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Disabled</p>
    <span class="slider" style="--slider-pct: 0.4">
      <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
      <input class="slider-input" type="range" min="0" max="100" value="40" aria-label="Disabled" disabled>
    </span>
  </div>
</div>
