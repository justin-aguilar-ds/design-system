<!-- personal-styling · slider · v0.3.0 -->
<div class="slider-field">
  <div class="slider-head">
    <label class="t-label" for="slider-opacity">Opacity</label>
    <output class="slider-value t-mono" for="slider-opacity">40</output>
  </div>
  <span class="slider">
    <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
    <input class="slider-input" id="slider-opacity" type="range" min="0" max="100" value="40">
  </span>
</div>
