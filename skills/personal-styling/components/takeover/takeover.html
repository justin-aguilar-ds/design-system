<!-- personal-styling · takeover · v0.1.0 -->
<!-- The trigger names the takeover it opens. Fill the body like a page:
     the title first, then what it is about. -->
<button class="button surface surface--rest surface--pill t-control" type="button" data-takeover="bet-detail">Open the bet</button>

<div class="takeover" id="bet-detail" role="dialog" aria-modal="true" aria-labelledby="bet-detail-title">
  <div class="takeover-body">
    <div style="display: grid; gap: 48px;">
      <h2 class="t-display" id="bet-detail-title" style="margin: 0;">+$18.87</h2>
      <p class="t-body" style="margin: 0;">Jayson Tatum over 26.5 points, settled Nov 3. One leg, at +115.</p>
    </div>
  </div>
  <button class="takeover-close button surface surface--rest surface--pill" type="button" aria-label="Back">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
