<div class="demo-grid">
  <div class="demo-cell">
    <p class="t-caption">Off</p>
    <label class="switch"><input class="switch-input" type="checkbox" role="switch" aria-label="Off"><span class="switch-track"><span class="switch-thumb"></span></span></label>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Off, hover</p>
    <label class="switch force-hover"><input class="switch-input" type="checkbox" role="switch" aria-label="Off, hover"><span class="switch-track"><span class="switch-thumb"></span></span></label>
  </div>
  <div class="demo-cell">
    <p class="t-caption">On</p>
    <label class="switch"><input class="switch-input" type="checkbox" role="switch" aria-label="On" checked><span class="switch-track"><span class="switch-thumb"></span></span></label>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Disabled</p>
    <label class="switch"><input class="switch-input" type="checkbox" role="switch" aria-label="Disabled" checked disabled><span class="switch-track"><span class="switch-thumb"></span></span></label>
  </div>
  <div class="demo-cell">
    <p class="t-caption">With its label</p>
    <label class="switch t-body"><input class="switch-input" type="checkbox" role="switch" checked><span class="switch-track"><span class="switch-thumb"></span></span>Weekly summary</label>
  </div>
  <div class="demo-cell demo-cell--wide demo-cell--stretch">
    <p class="t-caption">Beside a slider — one track, one thumb</p>
    <div class="control-panel-fields">
      <div class="slider-field">
        <label class="t-mono" for="demo-sw-smooth">Smoothing</label>
        <span class="slider">
          <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
          <input class="slider-input" id="demo-sw-smooth" type="range" min="0" max="100" value="40">
          <output class="slider-value t-mono" for="demo-sw-smooth">40</output>
        </span>
      </div>
      <div class="control-field">
        <span class="t-mono" id="demo-sw-labels">Labels</span>
        <label class="switch"><input class="switch-input" type="checkbox" role="switch" aria-labelledby="demo-sw-labels" checked><span class="switch-track"><span class="switch-thumb"></span></span></label>
      </div>
    </div>
  </div>
</div>
