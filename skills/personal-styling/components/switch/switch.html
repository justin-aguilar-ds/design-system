<!-- personal-styling · switch · v0.3.0 -->
<!-- With its label: the text goes inside the <label>. It leads the row
     and the track ends it, on the right. -->
<label class="switch t-body">
  <input class="switch-input" type="checkbox" role="switch" checked>
  <span class="switch-track"><span class="switch-thumb"></span></span>
  Weekly summary
</label>
<!-- Bare, at the end of a row or in a panel that names it: an aria-label
     or aria-labelledby on the input. -->
<label class="switch">
  <input class="switch-input" type="checkbox" role="switch" aria-label="Share location">
  <span class="switch-track"><span class="switch-thumb"></span></span>
</label>
