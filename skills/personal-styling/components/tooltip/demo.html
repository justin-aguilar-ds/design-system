<div class="demo-grid">
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Inline — hover, focus or tap the figure</p>
    <p class="t-body">Revenue was
      <button class="tooltip-trigger" type="button" data-tooltip="$1,214,880 — Jan 1 to Mar 31">$1.2M</button>
      last quarter.</p>
  </div>
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Gain and loss — the text and its icon in polarity ink</p>
    <p class="t-body">Player A moved
      <button class="tooltip-trigger" type="button" data-tooltip="+0.35 points a game since week 6" data-tooltip-ink="gain">up two places</button>,
      Player B
      <button class="tooltip-trigger" type="button" data-tooltip="−0.17 points a game since week 6" data-tooltip-ink="loss">down one</button>.</p>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Open, gain</p>
    <div class="tooltip is-visible is-text-visible is-pill" style="position: relative; z-index: auto">
      <p class="tooltip-text t-mono ink-gain"><svg class="tooltip-icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 8.5v-7M2.25 4.25 5 1.5l2.75 2.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> +0.35 a game</p>
    </div>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Trigger, hover</p>
    <p class="t-body"><button class="tooltip-trigger force-hover" type="button">$1.2M</button></p>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Open, text revealed</p>
    <div class="tooltip is-visible is-text-visible" style="position: relative; z-index: auto">
      <p class="tooltip-text t-mono">$1,214,880 — Jan 1 to Mar 31</p>
    </div>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Cursor pill</p>
    <div class="cursor-pill is-visible" style="position: relative; z-index: auto">
      <div class="cursor-pill-inner" style="transform: none">Learn more</div>
    </div>
  </div>
</div>
