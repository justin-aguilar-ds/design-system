<div class="demo-grid">
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Live — click to copy</p>
    <div class="demo-toast-room">
      <span class="toast-anchor">
        <button class="button surface surface--rest surface--pill t-label" type="button"
                data-copy="hello@example.com" data-toast="Copied">Copy email to clipboard</button>
        <span class="toast t-mono" role="status"></span>
      </span>
    </div>
  </div>
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Visible</p>
    <div class="demo-toast-room">
      <span class="toast-anchor">
        <button class="button surface surface--rest surface--pill t-control" type="button">Save</button>
        <span class="toast t-mono is-visible">Saved</span>
      </span>
    </div>
  </div>
</div>
