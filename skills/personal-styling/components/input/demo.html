<div class="demo-grid">
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Empty</p>
    <div class="input-field">
      <label class="t-label" for="demo-in-1">Name</label>
      <input class="input" id="demo-in-1" type="text" placeholder="Weekly export">
    </div>
  </div>
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Hover</p>
    <div class="input-field">
      <label class="t-label" for="demo-in-2">Name</label>
      <input class="input force-hover" id="demo-in-2" type="text" placeholder="Weekly export">
    </div>
  </div>
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Filled</p>
    <div class="input-field">
      <label class="t-label" for="demo-in-3">Name</label>
      <input class="input" id="demo-in-3" type="text" value="Quarterly reconciliation">
    </div>
  </div>
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Error</p>
    <div class="input-field">
      <label class="t-label" for="demo-in-4">Endpoint</label>
      <input class="input" id="demo-in-4" type="url" value="api.example.com" aria-invalid="true" aria-describedby="demo-in-4-msg">
      <p class="input-message t-caption is-error" id="demo-in-4-msg">✗ Enter a full URL, starting with https://</p>
    </div>
  </div>
  <div class="demo-cell demo-cell--stretch">
    <p class="t-caption">Disabled</p>
    <div class="input-field">
      <label class="t-label" for="demo-in-5">Workspace</label>
      <input class="input" id="demo-in-5" type="text" value="Personal" disabled>
    </div>
  </div>
  <div class="demo-cell demo-cell--wide demo-cell--stretch">
    <p class="t-caption">Beside a picker — the same 36px, labels above both</p>
    <div class="control-panel-fields">
      <div class="input-field">
        <label class="t-label" for="demo-in-6">Search</label>
        <span class="input-wrap input-wrap--search">
          <svg class="input-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input class="input" id="demo-in-6" type="search" placeholder="Delivery or endpoint">
        </span>
      </div>
      <div class="picker-field">
        <span class="t-label" id="demo-in-range">Range</span>
        <div class="picker">
          <button class="picker-trigger button surface surface--rest surface--pill t-control" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="demo-in-range-list" aria-labelledby="demo-in-range">
            <span class="picker-value">Last 7 days</span>
            <svg class="picker-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="picker-menu" hidden>
            <ul class="picker-list" id="demo-in-range-list" role="listbox" tabindex="-1" aria-labelledby="demo-in-range">
              <li class="picker-option t-control" role="option" aria-selected="false">Today</li>
              <li class="picker-option t-control" role="option" aria-selected="true">Last 7 days</li>
              <li class="picker-option t-control" role="option" aria-selected="false">Last 30 days</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
