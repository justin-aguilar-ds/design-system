<div class="demo-grid">
  <div class="demo-cell">
    <p class="t-caption">Rest</p>
    <button class="button surface surface--rest surface--pill t-label" type="button">Save changes</button>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Hover</p>
    <button class="button surface surface--rest surface--pill t-label force-hover" type="button">Save changes</button>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Focus</p>
    <button class="button surface surface--rest surface--pill t-label force-focus" type="button">Save changes</button>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Disabled</p>
    <button class="button surface surface--rest surface--pill t-label" type="button" disabled>Save changes</button>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Text, rest</p>
    <button class="button-text link-quiet t-control" type="button">Reset</button>
  </div>
  <div class="demo-cell">
    <p class="t-caption">Text, hover</p>
    <button class="button-text link-quiet t-control force-hover" type="button">Reset</button>
  </div>
  <div class="demo-cell demo-cell--wide">
    <p class="t-caption">Lockup — every label on one baseline</p>
    <div class="button-row">
      <button class="button surface surface--rest surface--pill t-label" type="button">Save changes</button>
      <button class="button surface surface--rest surface--pill t-control" type="button">Export</button>
      <button class="button-text link-quiet t-control" type="button">Delete week</button>
    </div>
  </div>
</div>
