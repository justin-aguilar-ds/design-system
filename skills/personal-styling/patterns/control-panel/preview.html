<div class="tile-zoom">
  <section class="control-panel surface accordion" aria-label="Controls">
    <div class="accordion-item is-open">
      <h2 class="accordion-heading"><button class="accordion-trigger" type="button" id="pv-cp-trigger" aria-expanded="true" aria-controls="pv-cp-body"><span class="t-mono">Controls</span><svg class="accordion-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h2>
      <div class="accordion-panel" id="pv-cp-body" role="region" aria-labelledby="pv-cp-trigger"><div class="accordion-content"><div class="accordion-body">
        <div class="control-panel-fields">
          <div class="control-field">
            <span class="t-label">View</span>
            <div class="segmented" role="group" aria-label="View">
              <span class="segmented-indicator" aria-hidden="true"></span>
              <button class="segmented-option is-active t-control" type="button" aria-pressed="true">Deliveries</button>
              <button class="segmented-option t-control" type="button" aria-pressed="false">Endpoints</button>
            </div>
          </div>
          <div class="control-field">
            <span class="t-label">Status</span>
            <div class="chip-row">
              <button class="chip t-control" type="button" aria-pressed="true"><span class="chip-dot" aria-hidden="true"></span>Delivered</button>
              <button class="chip t-control" type="button" aria-pressed="false"><span class="chip-dot" aria-hidden="true"></span>Failed</button>
            </div>
          </div>
        </div>
      </div></div></div>
    </div>
  </section>
</div>
