<!-- personal-styling · carousel · v0.1.0 -->
<section class="carousel" aria-roledescription="carousel" aria-label="Projects" tabindex="0">
  <div class="carousel-viewport">
    <ul class="carousel-track">
      <li class="carousel-item is-active" aria-roledescription="slide" data-title="Delivery monitor" data-meta="2026">
        <button class="carousel-frame" type="button" data-cursor="Learn more"
                data-tooltip-drop="Every webhook delivery from the last 30 days, with its status and latency." aria-label="Learn more about Delivery monitor">
          <span class="t-title">01</span>
        </button>
      </li>
      <li class="carousel-item" aria-roledescription="slide" data-title="Quarterly reconciliation" data-meta="2025">
        <button class="carousel-frame" type="button" data-cursor="Learn more"
                data-tooltip-drop="Line items checked against invoice totals, week by week." aria-label="Learn more about Quarterly reconciliation">
          <span class="t-title">02</span>
        </button>
      </li>
      <li class="carousel-item" aria-roledescription="slide" data-title="Endpoint health" data-meta="2025">
        <button class="carousel-frame" type="button" style="--item-aspect-ratio: 16 / 10; --item-width: min(560px, 90%);" data-cursor="Learn more"
                data-tooltip-drop="Failure rates for every endpoint, sorted by what needs attention first." aria-label="Learn more about Endpoint health">
          <span class="t-title">03</span>
        </button>
      </li>
      <li class="carousel-item" aria-roledescription="slide" data-title="Release notes" data-meta="2024">
        <button class="carousel-frame" type="button" data-cursor="Learn more"
                data-tooltip-drop="A changelog that writes itself from merged work." aria-label="Learn more about Release notes">
          <span class="t-title">04</span>
        </button>
      </li>
    </ul>
  </div>
  <div class="carousel-caption" aria-live="polite">
    <span class="t-label carousel-caption-title">Delivery monitor</span>
    <span class="t-mono carousel-caption-meta">2026</span>
  </div>
</section>
