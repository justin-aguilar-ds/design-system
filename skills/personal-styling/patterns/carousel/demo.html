<div class="pattern-demo-stack">
  <div class="pattern-demo">
    <p class="t-caption">Without the cursor pill and tooltip — a plain carousel, three items</p>

      <div class="carousel-viewport">
        <ul class="carousel-track">
          <li class="carousel-item is-active" aria-roledescription="slide" data-title="Morning" data-meta="06:40"><div class="carousel-frame" style="--item-aspect-ratio: 1 / 1; --item-width: min(280px, 60%)"><span class="t-title">A</span></div></li>
          <li class="carousel-item" aria-roledescription="slide" data-title="Noon" data-meta="12:05"><div class="carousel-frame" style="--item-aspect-ratio: 1 / 1; --item-width: min(280px, 60%)"><span class="t-title">B</span></div></li>
          <li class="carousel-item" aria-roledescription="slide" data-title="Evening" data-meta="19:30"><div class="carousel-frame" style="--item-aspect-ratio: 1 / 1; --item-width: min(280px, 60%)"><span class="t-title">C</span></div></li>
        </ul>
      </div>
      <div class="carousel-caption" aria-live="polite">
        <span class="t-label carousel-caption-title">Morning</span>
        <span class="t-mono carousel-caption-meta">06:40</span>
