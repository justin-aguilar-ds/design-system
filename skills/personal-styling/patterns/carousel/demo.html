<div class="pattern-demo-stack">
  <div class="pattern-demo">
    <p class="t-caption">Without the cursor pill and tooltip — a plain carousel, three items</p>
    <section class="carousel" aria-roledescription="carousel" aria-label="Photos" tabindex="0">
      <div class="carousel-viewport">
        <ul class="carousel-track">
          <li class="carousel-item is-active" aria-roledescription="slide" data-title="Morning" data-meta="06:40"><div class="carousel-frame" style="--item-aspect-ratio: 1 / 1; --item-width: min(280px, 60%)"><div class="expressive-hero expressive-hero--fill" data-style="stack" data-text="Morning|06:40" aria-hidden="true"></div></div></li>
          <li class="carousel-item" aria-roledescription="slide" data-title="Noon" data-meta="12:05"><div class="carousel-frame" style="--item-aspect-ratio: 1 / 1; --item-width: min(280px, 60%)"><div class="expressive-hero expressive-hero--fill" data-style="cross" data-text="Noon|12:05" aria-hidden="true"></div></div></li>
          <li class="carousel-item" aria-roledescription="slide" data-title="Evening" data-meta="19:30"><div class="carousel-frame" style="--item-aspect-ratio: 1 / 1; --item-width: min(280px, 60%)"><div class="expressive-hero expressive-hero--fill" data-style="rise" data-text="Evening|19:30" aria-hidden="true"></div></div></li>
        </ul>
      </div>
      <div class="carousel-caption" aria-live="polite">
        <span class="t-label carousel-caption-title">Morning</span>
        <span class="t-mono carousel-caption-meta">06:40</span>
      </div>
    </section>
  </div>
  <div class="pattern-demo">
    <p class="t-caption">A circle with open edges — data-loop, data-edges="open": past the last item is the first, and items fade rather than clip</p>
    <section class="carousel" aria-roledescription="carousel" aria-label="Views" tabindex="0" data-loop data-edges="open">
      <div class="carousel-viewport">
        <ul class="carousel-track">
          <li class="carousel-item is-active" aria-roledescription="slide" data-title="One" data-meta="1 of 3"><div class="carousel-frame" style="--item-aspect-ratio: 16 / 9; --item-width: 90%"><div class="expressive-hero expressive-hero--fill" data-style="data" data-text="One|1 of 3" aria-hidden="true"></div></div></li>
          <li class="carousel-item" aria-roledescription="slide" data-title="Two" data-meta="2 of 3"><div class="carousel-frame" style="--item-aspect-ratio: 16 / 9; --item-width: 90%"><div class="expressive-hero expressive-hero--fill" data-style="cross" data-text="Two|2 of 3" aria-hidden="true"></div></div></li>
          <li class="carousel-item" aria-roledescription="slide" data-title="Three" data-meta="3 of 3"><div class="carousel-frame" style="--item-aspect-ratio: 16 / 9; --item-width: 90%"><div class="expressive-hero expressive-hero--fill" data-style="stack" data-text="Three|3 of 3" aria-hidden="true"></div></div></li>
        </ul>
      </div>
      <div class="carousel-caption" aria-live="polite">
        <span class="t-label carousel-caption-title">One</span>
        <span class="t-mono carousel-caption-meta">1 of 3</span>
      </div>
    </section>
  </div>
</div>
