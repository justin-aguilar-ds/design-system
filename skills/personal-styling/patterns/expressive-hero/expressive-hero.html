     in view at rest. aria-hidden when the page shows the words elsewhere —
     role="img" with an aria-label when the hero carries the data alone.
     data-style: stack | data | rise | cross. data-text: title|value|value.
     data-scale: tiered (default) | even. data-values: sans (default) | mono.
     As the page's ground instead, see .expressive-hero--page in README.md. -->
<div class="expressive-hero" data-style="stack" data-text="Weekend|Sat 14|Sunny|3 plans" aria-hidden="true"></div>
