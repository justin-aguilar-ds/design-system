<div class="demo-grid">
  <div class="demo-cell demo-cell--wide demo-cell--stretch">
    <p class="t-caption">The pill in the corner — data-pill="right". Tap it, then drag the heading.</p>
    <div class="stage-sheet-frame">
      <div class="stage-sheet" data-pill="right">
        <section class="stage-sheet-stage" aria-label="Preview">
          <div style="display: grid; place-items: center; height: 100%;"><p class="t-display">Ripple</p></div>
        </section>
        <section class="stage-sheet-sheet" aria-label="Controls">
          <button class="stage-sheet-toggle" type="button" aria-expanded="false" aria-controls="sheet-body-demo">
            <span class="stage-sheet-title t-mono">Controls</span>
            <svg class="stage-sheet-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="stage-sheet-body" id="sheet-body-demo">
            <div class="control-field">
              <span class="t-mono" id="demo-sheet-weight">Weight</span>
              <div class="segmented" role="group" aria-labelledby="demo-sheet-weight">
                <span class="segmented-indicator" aria-hidden="true"></span>
                <button class="segmented-option is-active t-control" type="button" aria-pressed="true">Medium</button>
                <button class="segmented-option t-control" type="button" aria-pressed="false">Semibold</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
