# Hosts the sandbox (the "Personal styling" artifact's pages) on GitHub Pages.
# Deploying is deliberate: run it by hand from the Actions tab ("Deploy the
# sandbox" → Run workflow). Pushes and merges never deploy, so the hosted
# copy stays where it was last published until someone chooses to update it.
name: Deploy the sandbox

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Lint, then build dist/ from the skill's files. dist/ is never committed.
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
