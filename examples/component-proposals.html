<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Component Proposals</title>
<script>try { const t = localStorage.getItem('ps-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>

<link rel="stylesheet" href="lib/components/button/button.css">

<link rel="stylesheet" href="lib/components/input/input.css">
<link rel="stylesheet" href="lib/components/picker/picker.css">
<link rel="stylesheet" href="lib/components/slider/slider.css">
<link rel="stylesheet" href="lib/components/switch/switch.css">
<link rel="stylesheet" href="lib/components/choice/choice.css">
<link rel="stylesheet" href="lib/components/stepper/stepper.css">
<link rel="stylesheet" href="lib/patterns/control-panel/control-panel.css">
<link rel="stylesheet" href="lib/components/list-row/list-row.css">
<link rel="stylesheet" href="lib/components/toast/toast.css">

<link rel="stylesheet" href="lib/patterns/stage-sheet/stage-sheet.css">
<style>
  /* A proposal page as a stage and sheet: the components being proposed
     are the stage, on a page column at a phone's or the reading width;
     the options, the decisions and the notes are the sheet. Nothing here
     is in the skill yet. */
  h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
  body { background: var(--color-bg); }
  .tnum { font-variant-numeric: tabular-nums; }

  .stage-host {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: var(--space-48) var(--space-24);
    transition: padding var(--duration-deliberate) var(--ease-out);
  }
  @container stage-sheet (min-width: 631px) {
    .stage-sheet.is-open .stage-host { padding-right: calc(280px + 2 * var(--space-page)); }
  }
  @container stage-sheet (max-width: 630px) {
    .stage-host { padding-bottom: calc(var(--height-slot) + 2 * var(--space-page)); }
  }
  /* The page column the specimens sit in. They respond to its width, not
     the window's, so Phone and Read can be compared on one screen. */
  .specimens {
    container: col / inline-size;
    display: grid;
    gap: var(--space-48);
    width: var(--pw, 720px);
    max-width: 100%;
    margin-inline: auto;
  }
  .group { display: grid; gap: var(--space-48); }
  .group[hidden], .spec[hidden] { display: none; }
  .spec { display: grid; gap: var(--space-16); min-width: 0; }
  .spec-name { color: var(--color-text-secondary); }

  /* ============================================================
     PROPOSED · figures — several named figures side by side
     ============================================================ */
  /* Each figure is the Figure pair (mono name, Title number). The row
     only places them: on the page's three columns, 24 apart. */
  .figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-24); }
  .figure { min-width: 0; }
  .figure-value { white-space: nowrap; }
  .figure-change { color: var(--color-text); }
  .specimens:not(.has-change) .figure-change { display: none; }
  @container col (max-width: 630px) {
    .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* Ruled: a divider above each figure. On a phone each figure turns into
     a row, its name left and its number right, read down like a list. */
  .figures--ruled .figure { padding-top: var(--space-16); border-top: 1px solid var(--color-divider); }
  @container col (max-width: 630px) {
    .figures--ruled { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .figures--ruled .figure {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      justify-items: start;
      padding-block: var(--space-16);
    }
    .figures--ruled .figure:first-child { border-top: 0; padding-top: 0; }
    .figures--ruled .figure-value { grid-column: 2; grid-row: 1; justify-self: end; }
    .figures--ruled .figure-change { grid-column: 2; justify-self: end; }
  }
  /* Lead: one Big number on a row of its own, the rest in the grid. */
  .figures--lead .figure:first-child { grid-column: 1 / -1; }

  /* ============================================================
     PROPOSED · row styles — the list row on the page's columns
     ============================================================ */
  /* One markup, three layouts. One column: the name, its sentence under
     it, the value at the right of the name's line. Two: the name in the
     first third, the sentence in the other two. Three: a third each.
     On a phone every one of them is the one-column row. */
  .list-row--cols {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "name end" "desc desc";
    gap: var(--space-8) var(--space-16);
  }
  .row-name { grid-area: name; }
  .row-desc { grid-area: desc; }
  .row-end { grid-area: end; display: flex; align-items: center; gap: var(--gap-mark); white-space: nowrap; }
  .row-chevron { flex: none; width: var(--icon-mark); height: var(--icon-mark); color: var(--color-text-secondary); }
  .specimens:not(.has-chevron) .row-chevron { display: none; }
  @container col (min-width: 631px) {
    .list-row--cols:is([data-cols="2"], [data-cols="3"]) {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-24);
    }
    .list-row--cols[data-cols="2"] { grid-template-areas: "name desc desc"; }
    .list-row--cols[data-cols="3"] { grid-template-areas: "name desc end"; }
    .list-row--cols[data-cols="3"] .row-end { justify-self: end; }
  }
  /* Detail: a name and its value on one line — a spec list. */
  .list-row--detail { align-items: baseline; }
  .list-row--detail > :last-child { text-align: right; }
  .specimens.detail-column .list-row--detail { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-24); }
  .specimens.detail-column .list-row--detail > :last-child { grid-column: 2 / -1; text-align: left; }
  /* Setting: the name and its sentence left, one control at the end,
     centred on the row. */
  .list-row--setting { align-items: center; }
  .list-row--setting .list-row-main { gap: var(--space-8); }
  /* Status: glyph + word in mono. Good and unknown are secondary;
     a problem takes full ink. */
  .status { white-space: nowrap; }
  .status.is-problem { color: var(--color-text); }

  /* ============================================================
     PROPOSED · menu — actions behind one control
     ============================================================ */
  /* The picker's menu, holding actions instead of options: the same
     surface, inset, option height and gliding fill. Nothing is selected,
     so nothing carries a check. */
  .menu { position: relative; display: inline-flex; }
  .menu-chevron { flex: none; width: var(--icon-mark); height: var(--icon-mark); transition: transform var(--duration-base) var(--ease-out); }
  .menu.is-open .menu-chevron { transform: rotate(180deg); }
  .menu-surface {
    position: absolute;
    top: calc(100% + var(--space-8));
    right: 0;
    z-index: 40;
    padding: var(--inset-fill);
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-card);
    transform-origin: top right;
    transform: scale(var(--scale-enter));
    opacity: 0;
    transition: transform var(--duration-base) var(--ease-out), opacity var(--duration-base) var(--ease-out);
  }
  .menu.is-open .menu-surface { transform: scale(1); opacity: 1; }
  .menu-list { position: relative; z-index: 1; padding: 0; list-style: none; }
  .menu-item {
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    gap: var(--gap-mark);
    width: 100%;
    min-height: calc(2 * (var(--radius-card) - var(--inset-fill)));   /* 32: concentric with the menu's corner */
    padding: 0 calc(var(--inset-control) - var(--inset-fill));
    border-radius: var(--radius-pill);
    color: var(--color-text-secondary);
    white-space: nowrap;
    text-align: left;
    transition: color var(--duration-base) ease;
  }
  .menu-item.is-indicated { color: var(--color-text); }
  .menu-item:focus-visible { outline: none; }
  .menu-item:disabled { color: var(--color-text); opacity: var(--opacity-label-inactive); cursor: not-allowed; }
  .menu-icon { flex: none; width: var(--icon-inline); height: var(--icon-inline); }
  .specimens:not(.has-menu-icons) .menu-icon { display: none; }
  /* A divider sets the destructive action apart; its ink stays the same. */
  .menu-sep { margin: var(--inset-fill) calc(var(--inset-control) - var(--inset-fill)); border-top: 1px solid var(--color-divider); }
  .specimens:not(.has-menu-sep) .menu-sep { display: none; }
  .menu-fill {
    position: absolute;
    border-radius: var(--radius-pill);
    background: var(--color-fill-subtle);
    pointer-events: none;
    opacity: 0;
    transition:
      left var(--duration-base) var(--ease-out), top var(--duration-base) var(--ease-out),
      width var(--duration-base) var(--ease-out), height var(--duration-base) var(--ease-out),
      opacity var(--duration-base) ease;
  }
  .menu-surface.has-fill .menu-fill { opacity: 1; }
  .specimens.menu-label .menu-trigger--icon,
  .specimens:not(.menu-label) .menu-trigger--label { display: none; }
  .menu-readout { color: var(--color-text-secondary); }

  /* ============================================================
     ADOPTED · the inputs, now from the library, in a control panel
     beside the controls that were already there.
     ============================================================ */
  .cp { position: relative; width: var(--cp-w, 280px); max-width: 100%; padding: var(--space-16); display: grid; gap: var(--space-16); }
  /* The panel is shown at the docked or sheet width at any screen size,
     so it keeps the one-column layout the pattern gives a docked panel. */
  .cp.control-panel .control-panel-fields { position: relative; z-index: 1; grid-template-columns: minmax(min-content, 1fr) minmax(min-content, var(--control-max)); column-gap: var(--space-16); }
  .cp.control-panel .control-panel-fields > * { grid-column: 1 / -1; grid-template-columns: subgrid; }
  .cp.control-panel .control-panel-fields > :not(:first-child) { padding-top: var(--space-16); border-top: 1px solid var(--color-divider); }
  .cp-actions > .button-row { grid-column: 1 / -1; align-items: center; }
  .cp .choice-group { gap: 0; }
  /* Guides: a 36px band through the centre of each control, and the
     control's own drawn height after its label. */
  .cp-band { position: absolute; left: 0; right: 0; height: var(--height-control); background: var(--color-accent-soft); pointer-events: none; }
  .specimens:not(.has-guides) .cp-band { display: none; }
  .specimens.has-guides .cp-field > :first-child[data-h]::after { content: " " attr(data-h); color: var(--color-text); }
  .form { display: grid; gap: var(--space-24); justify-items: start; }
  .form > .input-field { width: 100%; }
  .state-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-16); }

  /* ---- The sheet ---- */
  .sheet-section { display: grid; gap: var(--space-16); padding-top: var(--space-24); border-top: 1px solid var(--color-divider); }
  .sheet-note { color: var(--color-text-secondary); }
  .proposals { padding: 0; list-style: none; display: grid; }
  .proposal { display: grid; gap: var(--space-16); padding-block: var(--space-16); border-top: 1px solid var(--color-divider); }
  .proposal[hidden], .control-field[hidden], .sheet-section[hidden] { display: none; }
  .proposal.is-first { border-top: 0; padding-top: 0; }
  .proposal > .segmented { justify-self: start; }
  .proposal-copy { display: grid; gap: var(--space-8); }
  .proposal.is-declined .proposal-copy { opacity: var(--opacity-label-inactive); }
</style>
</head>
<body ontouchstart>
<div class="stage-sheet">
  <section class="stage-sheet-stage" aria-label="Specimens">
    <div class="stage-host"><div class="specimens" id="specimens"></div></div>
  </section>
  <section class="stage-sheet-sheet" aria-label="Controls">
    <button class="stage-sheet-toggle" type="button" aria-expanded="false" aria-controls="sheet-body">
      <span class="stage-sheet-title t-mono">Review</span>
      <svg class="stage-sheet-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="stage-sheet-body" id="sheet-body"></div>
  </section>
</div>

<script>
// Everything is built before the component scripts set themselves up.
const KEY = 'component-proposals-1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const decisions = saved.decisions || {};
const notes = saved.notes || {};
const state = Object.assign({ group: 'figures', pw: 'read', change: 'on', chevron: 'off', detail: 'right', icons: 'off', sep: 'on', trigger: 'icon', guides: 'off', cpw: '280' }, saved.state);
['rowh', 'swh', 'mark', 'sw', 'step', 'small'].forEach((k) => delete state[k]);   // decided, and in the library
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const chevronRight = '<svg class="row-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 2 6.5 5 3.5 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const chevronDown = '<svg class="menu-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const spec = (id, name, html) => `<section class="spec" data-spec="${id}" aria-label="${name}"><p class="spec-name t-caption">${id} · ${name}</p>${html}</section>`;

// ---- Figures
const FIGS = [['Net this month', '+$4,212', '+12.4% on October', 'ink-gain'], ['Win rate', '58%', '−3 pts', 'ink-loss'], ['Open bets', '9', '2 settle today', '']];
const figure = ([name, value, change, ink], size = 't-title') => `
  <div class="figure type-pair">
    <span class="t-mono">${name}</span>
    <span class="figure-value ${size} tnum">${value}</span>
    <span class="figure-change t-mono ${ink}">${change}</span>
  </div>`;
const figures = `
  ${spec('F1', 'Figures on the grid', `<div class="figures">${FIGS.map((f) => figure(f)).join('')}</div>`)}
  ${spec('F2', 'Ruled figures', `<div class="figures figures--ruled">${FIGS.map((f) => figure(f)).join('')}</div>`)}
  ${spec('F3', 'A lead figure', `<div class="figures figures--lead">${figure(['Balance', '$18,640', '+$4,212 this month', 'ink-gain'], 't-display')}${FIGS.map((f) => figure(f)).join('')}</div>`)}`;

// ---- Rows
const PLACES = [['Lisbon', 'Four nights in Alfama, then the train north.', '$1,240'], ['Porto', 'Two nights by the river. The flight home leaves from here.', '$680'], ['Sintra', 'A day trip, booked through the hotel.', '$95']];
const colRow = (cols, [name, desc, value], open) => {
  const tag = open ? 'button type="button"' : 'div';
  return `<li><${tag} class="list-row list-row--cols" data-cols="${cols}">
    <span class="row-name t-label">${name}</span>
    <span class="row-desc t-body">${desc}</span>
    ${cols === 2 ? '' : `<span class="row-end"><span class="t-label tnum">${value}</span>${open ? chevronRight : ''}</span>`}
  </${open ? 'button' : 'div'}></li>`;
};
const switchCtl = (label, on, disabled) => `<label class="switch"><input class="switch-input" type="checkbox" role="switch" aria-label="${label}"${on ? ' checked' : ''}${disabled ? ' disabled' : ''}><span class="switch-track"><span class="switch-thumb"></span></span></label>`;
const stepperCtl = (label, value) => `
  <div class="stepper surface surface--rest surface--pill" data-min="0" data-max="12">
    <button class="stepper-step" type="button" aria-label="Fewer"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <input class="stepper-input" inputmode="numeric" aria-label="${label}" value="${value}">
    <button class="stepper-step" type="button" aria-label="More"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6M5 2v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>`;
const setting = (name, desc, control) => `<li><div class="list-row list-row--setting"><span class="list-row-main"><span class="t-label">${name}</span><span class="t-body">${desc}</span></span>${control}</div></li>`;
const statusRow = (name, sub, glyph, word, problem) => `<li><div class="list-row"><span class="list-row-main"><span class="list-row-name t-label">${name}</span><span class="list-row-sub t-mono">${sub}</span></span><span class="status t-mono${problem ? ' is-problem' : ''}">${glyph} ${word}</span></div></li>`;
const rows = `
  ${spec('R1', 'One column', `<ul class="list-rows">${PLACES.map((p) => colRow(1, p, true)).join('')}</ul>`)}
  ${spec('R2', 'Two columns', `<ul class="list-rows">${PLACES.map((p) => colRow(2, p)).join('')}</ul>`)}
  ${spec('R3', 'Three columns', `<ul class="list-rows">${PLACES.map((p) => colRow(3, p)).join('')}</ul>`)}
  ${spec('R4', 'Detail row', `<ul class="list-rows">${[['Dates', 'May 3 to May 9'], ['Travellers', 'Two adults'], ['Booked by', 'Justin'], ['Reference', 'LX-20418']].map(([k, v]) => `<li><div class="list-row list-row--detail"><span class="t-body">${k}</span><span class="t-body type-pair-value">${v}</span></div></li>`).join('')}</ul>`)}
  ${spec('R5', 'Setting row', `<ul class="list-rows">
    ${setting('Weekly summary', 'An email every Monday morning.', switchCtl('Weekly summary', true))}
    ${setting('Share location', 'Only while a trip is under way.', switchCtl('Share location', false))}
    ${setting('Travellers', 'Prices are worked out per person.', stepperCtl('Travellers', 2))}
  </ul>`)}
  ${spec('R6', 'Status row', `<ul class="list-rows">
    ${statusRow('Flight to Lisbon', 'May 3', '✓', 'Confirmed')}
    ${statusRow('Hotel in Alfama', 'May 3', '!', 'Awaiting payment', true)}
    ${statusRow('Train to Porto', 'May 7', '✗', 'Cancelled', true)}
    ${statusRow('Airport transfer', 'May 9', '–', 'Not booked')}
  </ul>`)}`;

// ---- Menu
const ICONS = {
  Rename: '<path d="m3 13 1-3.5L10.5 3 13 5.5 6.5 12 3 13Z"/>',
  Duplicate: '<rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M3 10.5V4a1 1 0 0 1 1-1h6.5"/>',
  Share: '<path d="M8 10V2.5M5 5l3-3 3 3M3 9.5v3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3"/>',
  Archive: '<path d="M2.5 3.5h11v3h-11zM3.5 6.5v6h9v-6M6.5 9.5h3"/>',
  Delete: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.5 8.5h6l.5-8.5"/>',
};
const item = (name, disabled) => `<li role="none"><button class="menu-item t-control" type="button" role="menuitem"${disabled ? ' disabled' : ''}><svg class="menu-icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>${name}</button></li>`;
const menu = `
  ${spec('M1', 'Menu of actions', `
    <ul class="list-rows"><li><div class="list-row list-row--setting">
      <span class="list-row-main"><span class="list-row-name t-label">Portugal in May</span><span class="list-row-sub t-mono">3 places · 6 nights</span></span>
      <div class="menu">
        <button class="menu-trigger menu-trigger--icon icon-button icon-button--secondary" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.5" fill="currentColor"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><circle cx="15.5" cy="10" r="1.5" fill="currentColor"/></svg>
        </button>
        <button class="menu-trigger menu-trigger--label button surface surface--rest surface--pill t-control" type="button" aria-haspopup="menu" aria-expanded="false">Actions${chevronDown}</button>
        <div class="menu-surface" hidden>
          <ul class="menu-list" role="menu" aria-label="Trip actions">
            ${item('Rename')}${item('Duplicate')}${item('Share')}${item('Archive', true)}
            <li class="menu-sep" role="separator"></li>
            ${item('Delete')}
          </ul>
        </div>
      </div>
    </div></li></ul>
    <p class="menu-readout t-caption swap" id="menu-readout" role="status">Nothing chosen yet.</p>`)}`;

// ---- Inputs
const choice = (type, name, label, checked, disabled) => `<label class="choice t-body"><input class="choice-input" type="${type}" name="${name}"${checked ? ' checked' : ''}${disabled ? ' disabled' : ''}><span class="choice-mark">${type === 'checkbox' ? '<svg class="choice-check" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.5 4.25 7.5 8 2.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<span class="choice-dot"></span>'}</span>${label}</label>`;

const cpSeg = `<div class="segmented" role="group" aria-labelledby="cp-view-l"><span class="segmented-indicator" aria-hidden="true"></span><button class="segmented-option is-active t-control" type="button" aria-pressed="true">Day</button><button class="segmented-option t-control" type="button" aria-pressed="false">Week</button></div>`;
const cpPick = `<div class="picker"><button class="picker-trigger button surface surface--rest surface--pill t-control" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="cp-range-list" aria-labelledby="cp-range-l cp-range-v"><span class="picker-value" id="cp-range-v">Last 7 days</span><svg class="picker-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="picker-menu" hidden><ul class="picker-list" id="cp-range-list" role="listbox" tabindex="-1" aria-labelledby="cp-range-l">${[['1d', 'Today'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days']].map(([v, t]) => `<li class="picker-option t-control" role="option" aria-selected="${v === '7d'}" data-value="${v}">${t}</li>`).join('')}</ul></div></div>`;
const cpSlider = `<span class="slider"><span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span><input class="slider-input" id="cp-smooth" type="range" min="0" max="100" value="40"><output class="slider-value t-mono" for="cp-smooth">40</output></span>`;
const cpField = (id, label, control, measure, cls = 'control-field') => `<div class="${cls} cp-field" data-measure="${measure}"><${cls === 'slider-field' ? 'label for="cp-smooth"' : 'span'} class="t-mono" id="cp-${id}-l">${label}</${cls === 'slider-field' ? 'label' : 'span'}>${control}</div>`;
const small = (html) => html;
const panel = `
  <section class="cp control-panel surface" aria-label="Controls">
    <h2 class="t-mono">Controls</h2>
    <div class="control-panel-fields">
      ${cpField('view', 'View', cpSeg, '.segmented')}
      ${cpField('range', 'Range', cpPick, '.picker-trigger')}
      ${cpField('smooth', 'Smoothing', cpSlider, '.slider-track', 'slider-field')}
      ${cpField('guests', 'Travellers', small(stepperCtl('Travellers', 2)), '.stepper')}
      ${cpField('labels', 'Labels', small(switchCtl('Labels', true)), '.switch-track')}
      ${cpField('grid', 'Gridlines', small(choice('checkbox', 'cp-grid', '', true)), '.choice-mark')}
      ${cpField('scale', 'Scale', `<fieldset class="choice-group" aria-labelledby="cp-scale-l">${choice('radio', 'cp-scale', 'Linear', true)}${choice('radio', 'cp-scale', 'Logarithmic', false)}</fieldset>`, '', 'control-field field--wide')}
      ${cpField('note', 'Note', `<textarea class="input input--area" aria-labelledby="cp-note-l" placeholder="Shown under the chart"></textarea>`, '', 'control-field field--wide')}
      <div class="cp-field cp-actions" data-measure=".button">
        <div class="button-row">
          <button class="button surface surface--rest surface--pill t-control" type="button">Apply</button>
          <button class="button-text link-quiet t-control" type="button">Reset</button>
          <button class="icon-button icon-button--secondary" type="button" aria-label="More"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.5" fill="currentColor"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><circle cx="15.5" cy="10" r="1.5" fill="currentColor"/></svg></button>
        </div>
      </div>
    </div>
  </section>`;
const inputs = `
  ${spec('Control panel', 'the inputs beside the other controls', panel)}
  ${spec('Switch', 'on, off, disabled', `<div class="state-row">${switchCtl('Off', false)}${switchCtl('On', true)}${switchCtl('Disabled', true, true)}</div>`)}
  ${spec('Choice', 'checkbox', `<fieldset class="choice-group"><legend class="t-label">Pack</legend>${choice('checkbox', 'pack', 'Passports', true)}${choice('checkbox', 'pack', 'Chargers and an adaptor', false)}${choice('checkbox', 'pack', 'Rain jackets', false)}${choice('checkbox', 'pack', 'Travel insurance', true, true)}</fieldset>`)}
  ${spec('Choice', 'radio', `<fieldset class="choice-group"><legend class="t-label">Getting to Porto</legend>${choice('radio', 'porto', 'Train, three hours', true)}${choice('radio', 'porto', 'Hire car', false)}${choice('radio', 'porto', 'Flight', false)}${choice('radio', 'porto', 'Coach', false, true)}</fieldset>`)}
  ${spec('Input', 'text area', `<div class="form"><div class="input-field"><label class="t-label" for="trip-notes">Notes</label><textarea class="input input--area" id="trip-notes" placeholder="Anything the others should know">The Alfama flat has no lift. Pack light.</textarea></div></div>`)}
  ${spec('Stepper', 'a small whole number', `<div class="control-field"><span class="t-label">Travellers</span>${stepperCtl('Travellers', 2)}</div>`)}`;

document.getElementById('specimens').innerHTML = [['figures', figures], ['rows', rows], ['menu', menu], ['inputs', inputs]]
  .map(([g, html]) => `<div class="group" data-group="${g}">${html}</div>`).join('');

// ---- The sheet
const seg = (id, label, opts, group) => `
  <div class="control-field"${group ? ` data-for="${group}"` : ''}>
    <span class="t-mono" id="${id}-l">${label}</span>
    <div class="segmented" role="group" aria-labelledby="${id}-l" id="${id}">
      <span class="segmented-indicator" aria-hidden="true"></span>
      ${opts.map(([v, t]) => `<button class="segmented-option t-control${v === state[id] ? ' is-active' : ''}" type="button" aria-pressed="${v === state[id]}" value="${v}">${t}</button>`).join('')}
    </div>
  </div>`;
const GROUPS = [['figures', 'Figures'], ['rows', 'Rows and lists'], ['menu', 'Menu of actions'], ['inputs', 'Inputs']];
const PROPOSALS = [
  ['figures', 'F1', 'Figures on the grid', 'A row of figures is the Figure pair, placed on the page’s three columns, 24 apart. On a phone, two columns. No card, no dividers.'],
  ['figures', 'F2', 'Ruled figures', 'A divider above each figure. On a phone each one turns into a row, its name left and its number right, so three or more read down like a list. Pick F1 or F2 as the default.'],
  ['figures', 'F3', 'A lead figure', 'One Big number on a row of its own, the rest under it in the grid. For a view where one figure is the reason and the others qualify it.'],
  ['figures', 'F4', 'A change under the figure', 'A third line in mono: how the figure moved. The change takes polarity ink; the figure stays black, so each value carries one signal. Switch it with Change.'],
  ['rows', 'R1', 'One column', 'The name, its sentence under it, the value at the right of the name’s line. The default, and what every row becomes on a phone.'],
  ['rows', 'R2', 'Two columns', 'The name in the first third, the sentence in the other two. For names scanned down the left. View at Read.'],
  ['rows', 'R3', 'Three columns', 'Name, sentence and value, a third each, the value at the right edge. View at Read.'],
  ['rows', 'R4', 'Detail row', 'A name and its value on one line: a spec list. Detail puts the value at the right edge, or on the second column so it lines up with every other list.'],
  ['rows', 'R5', 'Setting row', 'The name and its sentence on the left, one control at the end, centred on the row. The control is a switch or a stepper, from the library.'],
  ['rows', 'R6', 'Status row', 'Glyph and word in mono at the end of the row. Good and unknown in secondary ink, a problem in full ink. Never a badge, never colour.'],
  ['rows', 'R7', 'A chevron on rows that open', 'A 10px mark after the value on a row that opens something. Today a row that opens only brightens. Switch it with Chevron, on R1.'],
  ['menu', 'M1', 'Menu of actions', 'The picker’s menu holding actions: the same surface, inset, 32px items and gliding fill, growing from its trigger. Nothing is selected, so nothing carries a check. Arrow keys, Home, End and Escape work.'],
  ['menu', 'M2', 'Icons in the menu', 'A 16px icon before each action, in the label’s ink. Declined, the menu is words only. Switch it with Icons.'],
  ['menu', 'M3', 'A divider before the destructive action', 'Delete sits last, under a divider, in the same ink as the rest. It is never red: red is for values. Switch it with Divider.'],
  ['menu', 'M4', 'A labelled trigger', 'A button with a chevron (Actions) instead of the More icon button, for when the menu is the main way to act. Switch it with Trigger.'],
];
document.getElementById('sheet-body').innerHTML = `
  <div class="picker-field">
    <span class="t-mono" id="group-l">Component</span>
    <div class="picker" id="group">
      <button class="picker-trigger button surface surface--rest surface--pill t-control" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="group-list" aria-labelledby="group-l group-v">
        <span class="picker-value" id="group-v">${GROUPS.find(([v]) => v === state.group)[1]}</span>
        <svg class="picker-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="picker-menu" hidden>
        <ul class="picker-list" id="group-list" role="listbox" tabindex="-1" aria-labelledby="group-l">
          ${GROUPS.map(([v, t]) => `<li class="picker-option t-control" role="option" aria-selected="${v === state.group}" data-value="${v}">${t}</li>`).join('')}
        </ul>
      </div>
    </div>
  </div>
  ${seg('pw', 'Column', [['phone', 'Phone'], ['read', 'Read']])}
  ${seg('change', 'Change', [['off', 'Off'], ['on', 'On']], 'figures')}
  ${seg('chevron', 'Chevron', [['off', 'Off'], ['on', 'On']], 'rows')}
  ${seg('detail', 'Detail', [['right', 'Right'], ['column', 'Column']], 'rows')}
  ${seg('icons', 'Icons', [['off', 'Off'], ['on', 'On']], 'menu')}
  ${seg('sep', 'Divider', [['off', 'Off'], ['on', 'On']], 'menu')}
  ${seg('trigger', 'Trigger', [['icon', 'Icon'], ['label', 'Label']], 'menu')}
  ${seg('guides', '36 guides', [['off', 'Off'], ['on', 'On']], 'inputs')}
  ${seg('cpw', 'Panel', [['280', 'Dock'], ['358', 'Sheet']], 'inputs')}
  <div class="sheet-section" data-for="inputs">
    <p class="t-body sheet-note">Adopted. The switch, the checkbox and radio (choice), the stepper and the text area are in the library now, and this view loads them from there. A track and a mark are 16, a thumb 12, a mark 16 from its label; a small control ends its row in a panel.</p>
  </div>
  <div class="sheet-section" data-for="figures rows menu">
    <ol class="proposals" id="proposals">${PROPOSALS.map(([group, id, title, body]) => `
      <li class="proposal${decisions[id] === 'decline' ? ' is-declined' : ''}" data-id="${id}" data-for="${group}">
        <div class="proposal-copy">
          <h3 class="t-label">${id} ${title}</h3>
          <p class="t-body">${body}</p>
        </div>
        <div class="segmented" role="group" aria-label="${id} decision">
          <span class="segmented-indicator" aria-hidden="true"></span>
          ${['pending', 'approve', 'decline'].map((val) => `<button class="segmented-option t-control${(decisions[id] || 'pending') === val ? ' is-active' : ''}" type="button" aria-pressed="${(decisions[id] || 'pending') === val}" value="${val}">${val[0].toUpperCase() + val.slice(1)}</button>`).join('')}
        </div>
        <textarea class="input input--area proposal-note" aria-label="${id} notes" placeholder="What would you change?">${esc(notes[id] || '')}</textarea>
      </li>`).join('')}
    </ol>
  </div>
  <div class="sheet-section">
    <p class="t-body sheet-note" id="decision-summary"></p>
    <span class="toast-anchor">
      <button class="button surface surface--rest surface--pill t-control" type="button" id="copy-decisions" data-copy="" data-toast="Copied">Copy my decisions</button>
      <span class="toast t-mono" role="status"></span>
    </span>
  </div>`;
</script>
<script src="lib/components/segmented/segmented.js"></script>
<script src="lib/components/picker/picker.js"></script>
<script src="lib/components/slider/slider.js"></script>
<script src="lib/components/stepper/stepper.js"></script>
<script src="lib/components/toast/toast.js"></script>
<script src="lib/patterns/stage-sheet/stage-sheet.js"></script>
<script>
document.body.ontouchstart = () => {};
const specimens = document.getElementById('specimens');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ decisions, notes, state })); } catch {} };

const proposals = document.getElementById('proposals');
// The 36 guides: a band through each control's centre, and its drawn
// height after its label. Measured, so it tells the truth about whatever
// the switches above have changed.
function measure() {
  const cp = document.querySelector('.cp'); if (!cp || !cp.offsetParent) return;
  cp.querySelectorAll('.cp-band').forEach((b) => b.remove());
  const top = cp.getBoundingClientRect().top;
  cp.querySelectorAll('.cp-field').forEach((field) => {
    const el = field.dataset.measure && [...field.querySelectorAll(field.dataset.measure)].find((n) => n.offsetParent);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const band = Object.assign(document.createElement('span'), { className: 'cp-band' });
    band.style.top = `${r.top + r.height / 2 - top - 18 - 1}px`;   /* less the panel's 1px border */
    cp.prepend(band);
    const label = field.querySelector(':scope > .t-mono');
    if (label) label.dataset.h = Math.round(r.height);
  });
}
addEventListener('resize', measure);
document.fonts?.ready.then(measure);
function apply() {
  specimens.style.setProperty('--pw', state.pw === 'phone' ? '342px' : 'var(--container-read)');
  const on = { 'has-change': state.change === 'on', 'has-chevron': state.chevron === 'on', 'detail-column': state.detail === 'column',
    'has-menu-icons': state.icons === 'on', 'has-menu-sep': state.sep === 'on', 'menu-label': state.trigger === 'label', 'has-guides': state.guides === 'on' };
  specimens.style.setProperty('--cp-w', `${state.cpw}px`);
  Object.entries(on).forEach(([c, v]) => specimens.classList.toggle(c, v));
  specimens.querySelectorAll('.group').forEach((g) => { g.hidden = g.dataset.group !== state.group; });
  document.querySelectorAll('#sheet-body [data-for]').forEach((el) => { el.hidden = !el.dataset.for.split(' ').includes(state.group); });
  const shown = [...proposals.children].filter((li) => !li.hidden);
  shown.forEach((li, i) => li.classList.toggle('is-first', i === 0));
  summarise();
  save();
  measure();
}
Object.keys(state).forEach((k) => document.getElementById(k)?.addEventListener(k === 'group' ? 'picker-change' : 'segmented-change', (e) => {
  state[k] = e.detail.value;
  apply();
  if (k === 'group') document.querySelector('.stage-host').scrollTop = 0;
}));

function summarise() {
  const ids = PROPOSALS.map((p) => p[1]);
  const by = (v) => ids.filter((id) => (decisions[id] || 'pending') === v);
  const a = by('approve'), d = by('decline'), p = by('pending');
  document.getElementById('decision-summary').textContent = `${a.length} approved, ${d.length} declined, ${p.length} to decide, across figures, rows and the menu.`;
  const noted = ids.filter((id) => (notes[id] || '').trim());
  const { group, pw, ...options } = state;
  document.getElementById('copy-decisions').dataset.copy = [
    `Approve: ${a.join(', ') || 'none'}`,
    `Decline: ${d.join(', ') || 'none'}`,
    p.length ? `Undecided: ${p.join(', ')}` : '',
    noted.length ? `Notes:\n${noted.map((id) => `- ${id}: ${notes[id].trim()}`).join('\n')}` : '',
    `Options as left: ${Object.entries(options).map(([k, v]) => `${k}=${v}`).join(', ')}`,
  ].filter(Boolean).join('\n');
}
proposals.addEventListener('segmented-change', (e) => {
  const li = e.target.closest('.proposal'); if (!li) return;
  decisions[li.dataset.id] = e.detail.value;
  li.classList.toggle('is-declined', e.detail.value === 'decline');
  summarise(); save();
});
proposals.addEventListener('input', (e) => {
  const li = e.target.closest('.proposal'); if (!li) return;
  notes[li.dataset.id] = e.target.value;
  summarise(); save();
});

// ---- Proposed: menu. A button opens a list of actions; the fill glides
// to whatever the pointer or the arrow keys reach.
const MENU_CLOSE_MS = 250; // mirrors --duration-base
const SWAP_MS = 250;       // mirrors --duration-base
document.querySelectorAll('.menu').forEach((menu) => {
  const triggers = [...menu.querySelectorAll('.menu-trigger')];
  const surface = menu.querySelector('.menu-surface');
  const list = menu.querySelector('.menu-list');
  const items = () => [...list.querySelectorAll('.menu-item:not(:disabled)')];
  const fill = Object.assign(document.createElement('span'), { className: 'menu-fill' });
  fill.setAttribute('aria-hidden', 'true');
  surface.prepend(fill);
  let active = null, closeTimer = null, opener = null;
  const isOpen = () => menu.classList.contains('is-open');
  const indicate = (el, instant) => {
    active?.classList.remove('is-indicated');
    active = el || null;
    if (!active) { surface.classList.remove('has-fill'); return; }
    active.classList.add('is-indicated');
    if (instant || !surface.classList.contains('has-fill')) fill.style.transition = 'none';
    const li = active.parentElement;
    Object.assign(fill.style, { left: `${list.offsetLeft + li.offsetLeft}px`, top: `${list.offsetTop + li.offsetTop}px`, width: `${li.offsetWidth}px`, height: `${li.offsetHeight}px` });
    void fill.offsetWidth;
    fill.style.transition = '';
    surface.classList.add('has-fill');
  };
  const open = (trigger, viaKeyboard) => {
    clearTimeout(closeTimer);
    opener = trigger;
    surface.hidden = false;
    triggers.forEach((t) => t.setAttribute('aria-expanded', 'true'));
    requestAnimationFrame(() => menu.classList.add('is-open'));
    if (viaKeyboard) { indicate(items()[0], true); items()[0]?.focus({ preventScroll: true }); }
  };
  const close = (refocus = true) => {
    if (!isOpen()) return;
    menu.classList.remove('is-open');
    triggers.forEach((t) => t.setAttribute('aria-expanded', 'false'));
    if (refocus) opener?.focus();
    closeTimer = setTimeout(() => { surface.hidden = true; indicate(null); }, MENU_CLOSE_MS);
  };
  triggers.forEach((trigger) => {
    trigger.addEventListener('click', (e) => { if (isOpen()) close(); else open(trigger, e.detail === 0); });
    trigger.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); open(trigger, true); } });
  });
  list.addEventListener('pointermove', (e) => {
    const el = e.target.closest('.menu-item:not(:disabled)');
    if (e.pointerType === 'mouse' && el && el !== active) indicate(el);
  });
  list.addEventListener('pointerleave', () => { if (!list.contains(document.activeElement)) indicate(null); });
  list.addEventListener('keydown', (e) => {
    const all = items(), i = all.indexOf(document.activeElement);
    const to = { ArrowDown: all[Math.min(i + 1, all.length - 1)], ArrowUp: all[Math.max(i - 1, 0)], Home: all[0], End: all[all.length - 1] }[e.key];
    if (to) { e.preventDefault(); to.focus({ preventScroll: true }); indicate(to); }
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    if (e.key === 'Tab') close(false);
  });
  list.addEventListener('click', (e) => {
    const el = e.target.closest('.menu-item'); if (!el || el.disabled) return;
    close();
    // Drop, swap, rise: the readout changes in place.
    const readout = document.getElementById('menu-readout');
    readout.classList.add('is-leaving');
    setTimeout(() => { readout.textContent = `${el.textContent.trim()} chosen.`; void readout.offsetWidth; readout.classList.remove('is-leaving'); }, SWAP_MS);
  });
  document.addEventListener('pointerdown', (e) => { if (!menu.contains(e.target)) close(false); });
});

apply();
</script>
</body>
</html>
