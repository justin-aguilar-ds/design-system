<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Control Panel Proposals</title>
<script>try { const t = localStorage.getItem('ps-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="lib/tokens.css">
<link rel="stylesheet" href="lib/components/button/button.css">
<link rel="stylesheet" href="lib/components/segmented/segmented.css">
<link rel="stylesheet" href="lib/components/slider/slider.css">
<link rel="stylesheet" href="lib/components/picker/picker.css">
<link rel="stylesheet" href="lib/components/toast/toast.css">
<link rel="stylesheet" href="lib/patterns/stage-sheet/stage-sheet.css">
<style>
  /* A proposal page as a stage and sheet: the panel being proposed is the
     stage; the versions, the decisions and the copy button are the sheet. */
  h1, h2, h3, p { margin: 0; }
  body { background: var(--color-bg); }

  /* ---- The stage: the panel at the width it would have, centred, the
     stage scrolling when the panels are taller than it. On a wide screen
     the open sheet takes the corner, so the panels sit in the room
     beside it; on a phone the closed pill sits over the stage's end. */
  .stage-host {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: var(--space-48) var(--space-24);
    transition: padding var(--duration-deliberate) var(--ease-out);
  }
  @container stage-sheet (min-width: 631px) {
    .stage-sheet.is-open .stage-host { padding-right: calc(280px + 2 * var(--space-page)); }
  }
  @container stage-sheet (max-width: 630px) {
    .stage-host { padding-bottom: calc(var(--height-slot) + 2 * var(--space-page)); }
  }
  .panels {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: start;
    gap: var(--space-48) var(--space-24);
  }
  .version { display: grid; gap: var(--space-8); width: var(--pw); max-width: 100%; }
  .version[hidden] { display: none; }
  .version-name { color: var(--color-text-secondary); }
  .panels:not(.is-all) .version-name { display: none; }

  /* ============================================================
     PROPOSED · inline fields with a max width
     ============================================================ */
  /* The panel: the one surface, a mono title, the fields. */
  .pp { display: grid; gap: var(--space-16); padding: var(--space-16); box-shadow: var(--shadow-rest); }
  .pp-fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-24) var(--space-24); }
  .is-wide .pp-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  /* Dividers: one between fields, 16 either side (or 8: --ds). In three columns the
     first row of each column has none. */
  .pp.has-div .pp-fields { row-gap: calc(2 * var(--ds, var(--space-16))); }
  .pp.has-div .pp-row { position: relative; }
  .pp.has-div .pp-row::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: calc(-1 * var(--ds, var(--space-16)));
    border-top: 1px solid var(--color-divider);
  }
  .pp.has-div .pp-row:first-child::before,
  .is-wide .pp.has-div .pp-row:nth-child(-n + 3)::before { display: none; }

  /* A field is one row: the mono label left, the control right, the
     control growing to the max width and no wider. Short of room it
     shrinks first; only when it can't shrink enough (a segmented control
     at its options' width) does it drop under the label, still at the right. */
  .pp-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-8) var(--space-16);
    min-height: var(--height-control);
  }
  /* Every label in a panel takes its longest label's width (measured, as
     --lw), so when the controls have to give up some of the max width they
     all give up the same and still start on one line. */
  .pp-row > .pp-label { flex: none; display: flex; align-items: baseline; gap: var(--space-8); min-width: var(--lw, 0); }
  .pp-control {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-16);
    flex: 1 1 0;
    max-width: var(--cw);
    margin-left: auto;
  }

  /* Max width: every control fills it. Segments share it equally; a
     select runs across it with its chevron at the far end. */
  .pp .pp-control > .segmented { display: flex; width: 100%; }
  .pp .pp-control > .segmented .segmented-option { flex: 1; justify-content: center; }
  .pp .pp-control > .picker,
  .pp .pp-control .picker-trigger { width: 100%; }
  .pp .pp-control .picker-trigger { justify-content: space-between; }

  /* Natural width: segments and selects hug their options; only a slider
     takes the max width. */
  .pp.is-natural .pp-control:not(.pp-slider) { flex: none; max-width: none; }
  .pp.is-natural .pp-control > .segmented { display: inline-flex; width: auto; }
  .pp.is-natural .pp-control > .segmented .segmented-option { flex: none; }
  .pp.is-natural .pp-control > .picker,
  .pp.is-natural .pp-control .picker-trigger { width: auto; }
  .pp.is-natural .pp-control .picker-trigger { justify-content: flex-start; }

  /* A slider on the row: the track fills the max width, its value at the
     end of it. */
  .pp-slider .slider { flex: 1; min-width: 0; margin-block: calc((16px - 44px) / 2); }
  .pp-slider .slider-value { flex: none; min-width: 4ch; text-align: right; }
  /* Value beside the label: the track spans the whole max width, so its
     ends line up with every other control's. */
  .pp-label .slider-value { min-width: 4ch; text-align: left; } /* room for -20 or 900, so dragging never moves the track */
  /* Value in a tooltip: a pill above the thumb while the slider is hovered,
     focused or dragged. It grows from the thumb on the tooltip's timing. */
  .pp-slider .slider { position: relative; }
  .slider > .slider-value {
    position: absolute;
    left: calc(8px + var(--slider-pct, 0) * (100% - 16px)); /* the thumb's centre: 8px in from either end */
    bottom: calc(50% + 8px + var(--space-8)); /* 8 above the 16px track */
    min-width: 0;
    padding: var(--space-4) var(--space-8);
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-pill);
    white-space: nowrap;
    pointer-events: none;
    transform-origin: bottom center;
    translate: -50% 0;
    scale: 0;
    transition: scale var(--duration-pop) var(--ease-out);
  }
  .slider:is(.is-active, :focus-within) > .slider-value { scale: 1; }
  @media (hover: hover) and (pointer: fine) {
    .slider:hover > .slider-value { scale: 1; }
  }
  .pp .slider-field { display: flex; }

  /* ---- The sheet ---- */
  .sheet-section { display: grid; gap: var(--space-16); padding-top: var(--space-24); border-top: 1px solid var(--color-divider); }
  .sheet-note { color: var(--color-text-secondary); }
  .proposals { margin: 0; padding: 0; list-style: none; display: grid; }
  .proposal { display: grid; gap: var(--space-16); padding-block: var(--space-16); border-top: 1px solid var(--color-divider); }
  .proposal:first-child { border-top: 0; padding-top: 0; }
  .proposal > .segmented { justify-self: start; }
  .proposal-copy { display: grid; gap: var(--space-8); }
  .proposal.is-declined .proposal-copy { opacity: var(--opacity-label-inactive); }
</style>
</head>
<body ontouchstart>
<div class="stage-sheet">
  <section class="stage-sheet-stage" aria-label="Panel">
    <div class="stage-host" id="stage">
      <div class="panels" id="panels"></div>
    </div>
  </section>

  <section class="stage-sheet-sheet" aria-label="Controls">
    <button class="stage-sheet-toggle" type="button" aria-expanded="false" aria-controls="sheet-body">
      <span class="stage-sheet-title t-mono">Controls</span>
      <svg class="stage-sheet-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="stage-sheet-body" id="sheet-body"></div>
  </section>
</div>

<script>
// Everything is built before the component scripts set themselves up.
const seg = (id, label, opts, active) => `
  <div class="control-field">
    <span class="t-mono" id="${id}-l">${label}</span>
    <div class="segmented" role="group" aria-labelledby="${id}-l" id="${id}">
      <span class="segmented-indicator" aria-hidden="true"></span>
      ${opts.map(([v, t]) => `<button class="segmented-option t-control${v === active ? ' is-active' : ''}" type="button" aria-pressed="${v === active}" value="${v}">${t}</button>`).join('')}
    </div>
  </div>`;

// The panel being proposed: the typography tool's Type panel.
const PAIRS = [['europe', 'Europe'], ['tokyo', 'Tokyo'], ['harbour', 'Harbour'], ['paper', 'Paper']];
const FIELDS = [
  ['seg', 'Font', [['sans', 'Sans'], ['rounded', 'Rounded'], ['mono', 'Mono']], 'rounded'],
  ['slider', 'Weight', { min: 100, max: 900, step: 10, value: 710 }],
  ['seg', 'Italic', [['off', 'Off'], ['on', 'On']], 'off'],
  ['seg', 'Case', [['title', 'Aa'], ['upper', 'AA'], ['lower', 'aa']], 'upper'],
  ['slider', 'Tracking', { min: -20, max: 20, step: 1, value: -5 }],
  ['pick', 'Pair', PAIRS, 'europe'],
  ['seg', 'Ink', [['pair', 'Pair'], ['black', 'Black'], ['white', 'White']], 'pair'],
];
const VERSIONS = [
  ['a', 'A · Max width, dividers', 'max', true],
  ['b', 'B · Max width, no dividers', 'max', false],
  ['c', 'C · Natural width, dividers', 'natural', true],
  ['d', 'D · Natural width, no dividers', 'natural', false],
];
const field = (v, [kind, label, opts, active], k) => {
  const id = `${v}-${k}`;
  if (kind === 'slider') return `
    <div class="pp-row slider-field">
      <span class="pp-label"><label class="t-mono" for="${id}">${label}</label></span>
      <div class="pp-control pp-slider">
        <span class="slider">
          <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
          <input class="slider-input" id="${id}" type="range" min="${opts.min}" max="${opts.max}" step="${opts.step}" value="${opts.value}">
        </span>
        <output class="slider-value t-mono" for="${id}">${opts.value}</output>
      </div>
    </div>`;
  if (kind === 'seg') return `
    <div class="pp-row">
      <span class="pp-label"><span class="t-mono" id="${id}-l">${label}</span></span>
      <div class="pp-control">
        <div class="segmented" role="group" aria-labelledby="${id}-l">
          <span class="segmented-indicator" aria-hidden="true"></span>
          ${opts.map(([val, t]) => `<button class="segmented-option t-control${val === active ? ' is-active' : ''}" type="button" aria-pressed="${val === active}" value="${val}">${t}</button>`).join('')}
        </div>
      </div>
    </div>`;
  return `
    <div class="pp-row">
      <span class="pp-label"><span class="t-mono" id="${id}-l">${label}</span></span>
      <div class="pp-control">
        <div class="picker">
          <button class="picker-trigger button surface surface--rest surface--pill t-control" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="${id}-list" aria-labelledby="${id}-l ${id}-v">
            <span class="picker-value" id="${id}-v">${opts.find((o) => o[0] === active)[1]}</span>
            <svg class="picker-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="picker-menu" hidden>
            <ul class="picker-list" id="${id}-list" role="listbox" tabindex="-1" aria-labelledby="${id}-l">
              ${opts.map(([val, t]) => `<li class="picker-option t-control" role="option" aria-selected="${val === active}" data-value="${val}">${t}</li>`).join('')}
            </ul>
          </div>
        </div>
      </div>
    </div>`;
};
document.getElementById('panels').innerHTML = VERSIONS.map(([v, name, width, div]) => `
  <section class="version" data-version="${v}" aria-label="${name}">
    <p class="version-name t-caption">${name}</p>
    <div class="pp surface${width === 'natural' ? ' is-natural' : ''}${div ? ' has-div' : ''}">
      <h2 class="t-mono">Type</h2>
      <div class="pp-fields">${FIELDS.map((f, k) => field(v, f, k)).join('')}</div>
    </div>
  </section>`).join('');

const PROPOSALS = [
  ['C1', 'Inline fields with a max width', 'Every field is one row: the mono label on the left, the control on the right, and no control wider than one max width. A slider’s track fills the max width on the label’s row, its ends on the same lines as every other control, instead of a row of its own under the label. If the label and the control can’t share the row, the control drops under the label, still at the right.'],
  ['C2', 'Every control at the max width', 'Segments share the max width equally and a select runs across it, so every control on the right starts and ends on the same lines. Versions A and B. Pick C2 or C3.'],
  ['C3', 'Controls at their natural width', 'Segments and selects hug their options, right-aligned; only a slider takes the max width. Versions C and D. Pick C2 or C3.'],
  ['C4', 'Dividers between fields', 'A divider between fields, as the control panel has today (versions A and C). Declined, fields sit 24 apart with nothing between them (versions B and D).'],
  ['C5', '8 between a divider and the controls', 'With dividers, 8 either side of the line instead of 16: the panel tightens to a list of rows. 8 is already on the scale (it is the label-to-control distance), so no new step. Every row keeps the 36 control height, so a slider’s row is as tall as a segment’s.'],
  ['C6', 'A slider’s value beside its label', 'The value follows the label on the left, in full ink: Weight 510. Always visible, nothing to hover. Pick C6 or C7.'],
  ['C7', 'A slider’s value in a tooltip', 'The value rides above the thumb in a pill while the slider is hovered, focused or dragged, and is hidden otherwise. The quietest row; the value isn’t readable at a glance. Pick C6 or C7.'],
];
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem('panel-proposals-2') || '{}'); } catch {}

document.getElementById('sheet-body').innerHTML = `
  ${seg('view', 'Show', [['one', 'One'], ['all', 'All four']], 'one')}
  ${seg('width', 'Controls', [['max', 'Max width'], ['natural', 'Natural']], 'max')}
  ${seg('div', 'Dividers', [['on', 'On'], ['off', 'Off']], 'on')}
  ${seg('cw', 'Max width', [['200', '200'], ['240', '240'], ['280', '280']], '240')}
  ${seg('ds', 'Divider space', [['16', '16'], ['8', '8']], '16')}
  ${seg('val', 'Slider value', [['label', 'Label'], ['tip', 'Tooltip'], ['end', 'End']], 'label')}
  ${seg('pw', 'Panel', [['280', 'Dock'], ['374', 'Phone'], ['wide', 'Wide']], '374')}
  <div class="sheet-section">
    <p class="t-body sheet-note">The Type panel from the typography tool, laid out inline with a max width on every control. Dock is the 280 card in the corner, Phone the sheet on a 390 screen, Wide the panel above a tool on a desktop, three fields across.</p>
  </div>
  <div class="sheet-section">
    <h2 class="t-label">The ideas</h2>
    <ol class="proposals" id="proposals">${PROPOSALS.map(([id, title, body]) => `
      <li class="proposal${decisions[id] === 'decline' ? ' is-declined' : ''}" data-id="${id}">
        <div class="proposal-copy">
          <h3 class="t-label">${id} ${title}</h3>
          <p class="t-body">${body}</p>
        </div>
        <div class="segmented" role="group" aria-label="${id} decision">
          <span class="segmented-indicator" aria-hidden="true"></span>
          ${['pending', 'approve', 'decline'].map((val) => `<button class="segmented-option t-control${(decisions[id] || 'pending') === val ? ' is-active' : ''}" type="button" aria-pressed="${(decisions[id] || 'pending') === val}" value="${val}">${val[0].toUpperCase() + val.slice(1)}</button>`).join('')}
        </div>
      </li>`).join('')}
    </ol>
    <p class="t-body sheet-note" id="decision-summary"></p>
    <span class="toast-anchor">
      <button class="button surface surface--rest surface--pill t-control" type="button" id="copy-decisions" data-copy="" data-toast="Copied">Copy my decisions</button>
      <span class="toast t-mono" role="status"></span>
    </span>
  </div>`;
</script>
<script src="lib/components/segmented/segmented.js"></script>
<script src="lib/components/slider/slider.js"></script>
<script src="lib/components/picker/picker.js"></script>
<script src="lib/components/toast/toast.js"></script>
<script src="lib/patterns/stage-sheet/stage-sheet.js"></script>
<script>
document.body.ontouchstart = () => {};
const state = { view: 'one', width: 'max', div: 'on', cw: '240', pw: '374', ds: '16', val: 'label' };
const panels = document.getElementById('panels');
function measureLabels() {
  panels.querySelectorAll('.pp').forEach((pp) => {
    pp.style.removeProperty('--lw');
    const widest = Math.max(...[...pp.querySelectorAll('.pp-label')].map((l) => l.getBoundingClientRect().width));
    if (widest > 0) pp.style.setProperty('--lw', `${Math.ceil(widest)}px`);
  });
}
document.fonts?.ready.then(measureLabels);
function apply() {
  panels.classList.toggle('is-all', state.view === 'all');
  panels.classList.toggle('is-wide', state.pw === 'wide');
  panels.style.setProperty('--cw', `${state.cw}px`);
  panels.style.setProperty('--ds', `${state.ds}px`);
  // The slider's value moves: beside the label, into the slider as a
  // tooltip, or at the end of the track.
  panels.querySelectorAll('.pp-slider').forEach((ctl) => {
    const row = ctl.closest('.pp-row'), out = row.querySelector('.slider-value');
    const to = { label: row.querySelector('.pp-label'), tip: ctl.querySelector('.slider'), end: ctl }[state.val];
    if (out.parentElement !== to) to.append(out);
  });
  measureLabels();
  panels.style.setProperty('--pw', state.pw === 'wide' ? 'var(--container)' : `${state.pw}px`);
  const shown = VERSIONS.find(([, , w, d]) => w === state.width && d === (state.div === 'on'))[0];
  panels.querySelectorAll('.version').forEach((el) => { el.hidden = state.view === 'one' && el.dataset.version !== shown; });
  summarise();
}
['view', 'width', 'div', 'cw', 'pw', 'ds', 'val'].forEach((k) => document.getElementById(k).addEventListener('segmented-change', (e) => { state[k] = e.detail.value; apply(); }));

function summarise() {
  const ids = PROPOSALS.map((p) => p[0]);
  const by = (v) => ids.filter((id) => (decisions[id] || 'pending') === v);
  const a = by('approve'), d = by('decline'), p = by('pending');
  document.getElementById('decision-summary').textContent = `${a.length} approved, ${d.length} declined, ${p.length} to decide.`;
  document.getElementById('copy-decisions').dataset.copy = `Approve: ${a.join(', ') || 'none'}\nDecline: ${d.join(', ') || 'none'}${p.length ? `\nUndecided: ${p.join(', ')}` : ''}\nMax width: ${state.cw}`;
}
document.getElementById('proposals').addEventListener('segmented-change', (e) => {
  const item = e.target.closest('.proposal'); if (!item) return;
  decisions[item.dataset.id] = e.detail.value;
  try { localStorage.setItem('panel-proposals-2', JSON.stringify(decisions)); } catch {}
  item.classList.toggle('is-declined', e.detail.value === 'decline');
  summarise();
});
apply();
</script>
</body>
</html>
