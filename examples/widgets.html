<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Widgets</title>
<script>try { const t = localStorage.getItem('ps-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="lib/tokens.css">
<link rel="stylesheet" href="lib/components/button/button.css">
<link rel="stylesheet" href="lib/components/icon-button/icon-button.css">
<link rel="stylesheet" href="lib/components/segmented/segmented.css">
<link rel="stylesheet" href="lib/components/slider/slider.css">
<link rel="stylesheet" href="lib/components/input/input.css">
<link rel="stylesheet" href="lib/components/picker/picker.css">
<link rel="stylesheet" href="lib/components/list-row/list-row.css">
<link rel="stylesheet" href="lib/components/line-chart/line-chart.css">
<link rel="stylesheet" href="lib/components/stepper/stepper.css">
<link rel="stylesheet" href="lib/components/toast/toast.css">
<link rel="stylesheet" href="lib/patterns/type-pairs/type-pairs.css">
<link rel="stylesheet" href="lib/patterns/stage-sheet/stage-sheet.css">
<style>
  /* A gap audit as a stage and sheet. The stage is a set of small widgets
     built from the library alone; wherever the library had no answer the
     part was drawn here, and it carries data-gap so it can be outlined.
     The sheet lists the gaps and holds the switches. Nothing here is in
     the skill. */
  h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
  body { background: var(--color-bg); }
  .tnum { font-variant-numeric: tabular-nums; }
  .quiet { color: var(--color-text-secondary); }
  .ink { color: var(--color-text); }

  .stage-host {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: var(--space-48) var(--space-24);
    transition: padding var(--duration-deliberate) var(--ease-out);
  }
  @container stage-sheet (min-width: 631px) {
    .stage-sheet.is-open .stage-host { padding-right: calc(280px + 2 * var(--space-page)); }
  }
  @container stage-sheet (max-width: 630px) {
    .stage-host { padding-bottom: calc(var(--height-slot) + 2 * var(--space-page)); }
  }

  /* The set: the page's three columns, 24 apart, a widget a column; one
     column on a phone. A tile is the widget with its name under it. */
  .widgets {
    container: set / inline-size;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-48) var(--space-24);
    max-width: var(--container);
    margin-inline: auto;
  }
  @container stage-sheet (min-width: 760px) {
    .widgets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @container stage-sheet (min-width: 1100px) {
    .widgets { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .tile { display: grid; align-content: start; gap: var(--space-16); min-width: 0; scroll-margin: var(--space-24); }
  .tile-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-16); }
  .tile-foot .button-text { margin-right: calc(-1 * var(--inset-control)); }
  .tile-name { display: grid; gap: var(--space-4); }
  .tile-gaps { color: var(--color-text-secondary); }

  /* The widget's frame, the first thing under test (Frame in the sheet):
     the stage's grey ground, or the one surface. */
  .widget {
    container: w / inline-size;
    position: relative;
    display: grid;
    align-content: start;
    gap: var(--space-24);
    min-width: 0;
    padding: var(--space-24);
    border-radius: var(--radius-card);
    background: var(--color-stage);
    color: var(--color-text-secondary);
    transition: box-shadow var(--duration-fast) ease;
  }
  .frame-card .widget { background: var(--color-surface); box-shadow: inset 0 0 0 1px var(--color-hairline); }
  .tile.is-current .widget { box-shadow: inset 0 0 0 1px var(--color-text); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-16); }
  .row-base { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-16); }
  .ico { flex: none; width: var(--icon-control); height: var(--icon-control); color: var(--color-text); }
  .ico--inline { width: var(--icon-inline); height: var(--icon-inline); }
  .figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-16); }
  .figures .type-pair { min-width: 0; }

  /* ---- 1 Boarding pass ---- */
  .pass-route { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: var(--space-16); }
  .pass-to { justify-items: end; text-align: right; }
  .pass-line { position: relative; display: grid; place-items: center; height: 64px; }   /* the display line's height */
  .pass-line::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--color-hairline-strong); }
  .pass-line svg { position: relative; padding: 0 var(--space-8); background: var(--w-ground, var(--color-stage)); box-sizing: content-box; }
  .frame-card .pass-line svg { --w-ground: var(--color-surface); }
  .pass-tear { margin-inline: calc(-1 * var(--space-24)); border-top: 1px dashed var(--color-hairline-strong); }
  .pass-code { display: grid; gap: var(--space-8); }
  .pass-code svg { width: 100%; height: 48px; color: var(--color-text); }

  /* ---- 2 Weather ---- */
  .wx-hours {
    display: flex;
    gap: var(--space-24);
    margin-inline: calc(-1 * var(--space-24));
    padding-inline: var(--space-24);
    overflow-x: auto;
    scrollbar-width: none;
    mask-image: linear-gradient(to right, transparent, #000 var(--space-24), #000 calc(100% - var(--space-24)), transparent);
  }
  .wx-hours::-webkit-scrollbar { display: none; }
  .wx-hour { display: grid; justify-items: center; gap: var(--space-8); flex: none; }
  .wx-days { padding: 0; list-style: none; display: grid; }
  .wx-day { display: grid; grid-template-columns: 4ch var(--icon-control) 3ch minmax(0, 1fr) 3ch; align-items: center; gap: var(--space-16); padding-block: var(--space-8); }
  .wx-day + .wx-day { border-top: 1px solid var(--color-divider); }
  .range { position: relative; height: 4px; border-radius: var(--radius-pill); background: var(--color-range-track); }
  .range > span { position: absolute; top: 0; bottom: 0; border-radius: var(--radius-pill); background: var(--color-text); }

  /* ---- 3 Today ---- */
  .agenda { padding: 0; list-style: none; display: grid; }
  .agenda-item { display: grid; grid-template-columns: 5ch minmax(0, 1fr) auto; align-items: baseline; gap: var(--space-4) var(--space-16); padding-block: var(--space-16); border-top: 1px solid var(--color-divider); }
  .agenda-item:first-child { border-top: 0; }
  .agenda-item > :nth-child(3) { align-self: center; grid-row: span 2; }
  .agenda-item > .t-body { grid-column: 2; }
  .agenda-item.is-past { opacity: var(--opacity-label-inactive); }
  .now { display: flex; align-items: center; gap: var(--space-8); color: var(--color-text); }
  .now::after { content: ""; flex: 1; border-top: 1px solid currentColor; }
  .stack { display: flex; }
  /* Avatars, under test (Avatar fill in the sheet). The quiet fill is
     translucent, so where circles overlap the ring and the circle under it
     show through. Solid: #e6e6e6, which is exactly what the quiet
     fill looks like over the stage, made opaque, so it reads on white and
     on the stage alike. Series: the chart grey. */
  .widgets { --avatar-fill: #e6e6e6; }
  @media (prefers-color-scheme: dark) { .widgets { --avatar-fill: #262626; } }
  :root[data-theme="dark"] .widgets { --avatar-fill: #262626; }
  :root[data-theme="light"] .widgets { --avatar-fill: #e6e6e6; }
  .widgets.avatar-quiet { --avatar-fill: var(--color-fill-quiet); }
  .widgets.avatar-series { --avatar-fill: var(--color-series); }
  .widget .list-row-lead.is-avatar { background: var(--avatar-fill); }
  .stack > span { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--avatar-fill); box-shadow: 0 0 0 2px var(--w-ground, var(--color-stage)); color: var(--color-text); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0; }
  .stack > span + span { margin-left: calc(-1 * var(--space-8)); }
  .frame-card .stack > span { --w-ground: var(--color-surface); }

  /* ---- 4 Trending ---- */
  .trend { padding: 0; list-style: none; display: grid; }
  .trend li { display: grid; grid-template-columns: 2ch minmax(0, 1fr) auto auto; align-items: center; gap: var(--space-16); padding-block: var(--space-16); border-top: 1px solid var(--color-divider); }
  .trend li:first-child { border-top: 0; padding-top: 0; }
  .trend .rank { color: var(--color-text-secondary); }
  .trend li > div { display: grid; gap: var(--space-4); min-width: 0; }
  .spark { width: 64px; height: 20px; color: var(--color-series); }
  .spark path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- 5 Now playing ---- */
  .np-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: var(--space-16); }
  .art { width: 64px; height: 64px; border-radius: var(--radius-card); background: var(--color-stage); }
  .frame-stage .art { background: var(--color-stage); }
  .np-times { display: flex; justify-content: space-between; margin-top: var(--space-8); }
  .np-controls { display: flex; align-items: center; justify-content: center; gap: var(--space-24); }

  /* ---- 6 Activity ---- */
  .meter { height: 16px; border-radius: var(--radius-pill); background: var(--color-range-track); overflow: hidden; }
  .meter > span { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--color-text); }

  /* ---- 7 Package ---- */
  .steps { padding: 0; list-style: none; display: grid; }
  .step { position: relative; display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: baseline; gap: var(--space-16); padding-bottom: var(--space-16); }
  .step::before { content: ""; position: absolute; left: 3.5px; top: 12px; bottom: -4px; border-left: 1px solid var(--color-text-secondary); }
  .step:last-child::before { display: none; }
  .step-dot { width: 8px; height: 8px; border: 1px solid currentColor; border-radius: var(--radius-pill); align-self: center; }
  .step.is-done .step-dot { background: currentColor; }
  .step.is-done, .step.is-current { color: var(--color-text); }
  .step.is-current .step-dot { background: currentColor; outline: 2px solid var(--color-text); outline-offset: 2px; }

  /* ---- 8 Portfolio ---- */
  .widget .line-chart { margin-inline: 0; }
  .widget .segmented { justify-self: start; }

  /* ---- 9 Inbox ---- */
  .widget .list-rows { margin-block: calc(-1 * var(--space-24)); }
  .unread { display: inline-block; width: 8px; height: 8px; margin-left: var(--space-8); border-radius: var(--radius-pill); background: var(--color-text); }
  .widget .list-row-value.t-body { color: var(--color-text-secondary); font-weight: 500; }

  /* ---- 10 Sleep ---- */
  .bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: end; gap: var(--space-8); height: 120px; }
  .bar { display: grid; grid-template-rows: 1fr auto; gap: var(--space-8); height: 100%; justify-items: center; }
  .bar > span:first-child { align-self: end; width: 100%; border-radius: var(--radius-pill); background: var(--color-series); }
  .bar.is-focus > span:first-child { background: var(--color-text); }

  /* ---- 11 Split ---- */
  .widget .button--large { position: static; width: 100%; }

  /* ---- 12 Timer ---- */
  .timer-face { display: grid; justify-items: center; gap: var(--space-8); padding-block: var(--space-24); }
  .timer-face .t-display { font-size: 56px; }
  .button-row--center { justify-content: center; align-items: center; }

  /* ---- The gaps, outlined: dashed, the system's line for provisional. */
  .gap-box {
    position: absolute;
    z-index: 2;
    border: 1px dashed var(--color-text);
    border-radius: var(--radius-card);
    pointer-events: none;
  }
  .gap-box > span {
    position: absolute;
    top: -9px;
    right: var(--space-8);
    padding: 0 var(--space-4);
    background: var(--color-accent);
    color: var(--color-accent-ink);
    border-radius: var(--radius-pill);
  }
  .widgets:not(.show-gaps) .gap-box { display: none; }

  /* ---- The sheet ---- */
  .sheet-section { display: grid; gap: var(--space-16); padding-top: var(--space-24); border-top: 1px solid var(--color-divider); }
  .sheet-note { color: var(--color-text-secondary); }
  .gap-list { padding: 0; list-style: none; display: grid; }
  .gap-item { display: grid; gap: var(--space-8); padding-block: var(--space-16); border-top: 1px solid var(--color-divider); }
  .gap-item:first-child { border-top: 0; padding-top: 0; }
  .gap-item .button-text { justify-self: start; margin-left: calc(-1 * var(--inset-control)); }
  .notes[hidden] { display: none; }
</style>
</head>
<body ontouchstart>
<div class="stage-sheet" data-open="false">
  <section class="stage-sheet-stage" aria-label="Widgets">
    <div class="stage-host"><div class="widgets frame-stage" id="widgets"></div></div>
  </section>
  <section class="stage-sheet-sheet" aria-label="Review">
    <button class="stage-sheet-toggle" type="button" aria-expanded="false" aria-controls="sheet-body">
      <span class="stage-sheet-title t-mono">Gaps</span>
      <svg class="stage-sheet-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="stage-sheet-body" id="sheet-body"></div>
  </section>
</div>

<script>
// Everything is built before the component scripts set themselves up.
const KEY = 'widgets-1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const state = Object.assign({ frame: 'stage', gaps: 'on', avatar: 'solid' }, saved.state);
const notes = saved.notes || {};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Icons drawn here, on the system's rules (a 20 viewBox, a 1.5 stroke,
// round, current colour). There is no icon set: that is gap G6.
const P = {
  plane: '<path d="m3 11 14-6-5 12-2.5-5L3 11Z"/>',
  sun: '<circle cx="10" cy="10" r="3.5"/><path d="M10 2.5v1.5M10 16v1.5M2.5 10H4M16 10h1.5M4.7 4.7l1 1M14.3 14.3l1 1M4.7 15.3l1-1M14.3 5.7l1-1"/>',
  cloud: '<path d="M6 15.5h8.5a3 3 0 0 0 .3-6A4.5 4.5 0 0 0 6 8.5a3.5 3.5 0 0 0 0 7Z"/>',
  part: '<path d="M7.5 4.5v-1M3.7 6.2l-.7-.7M11.3 6.2l.7-.7M3 9.5H2"/><path d="M5.3 9.2a2.5 2.5 0 0 1 4.6-1.6"/><path d="M8 16h7a2.5 2.5 0 0 0 .2-5A3.5 3.5 0 0 0 8.5 10 3 3 0 0 0 8 16Z"/>',
  rain: '<path d="M6 12.5h8.5a3 3 0 0 0 .3-6A4.5 4.5 0 0 0 6 5.5a3.5 3.5 0 0 0 0 7Z"/><path d="M7 15l-.7 2M10.5 15l-.7 2M14 15l-.7 2"/>',
  prev: '<path d="M14 5v10l-7-5 7-5ZM5.5 5v10"/>',
  next: '<path d="M6 5v10l7-5-7-5ZM14.5 5v10"/>',
  play: '<path d="M7 4.5v11l9-5.5-9-5.5Z"/>',
  pause: '<path d="M7.5 5v10M12.5 5v10"/>',
  box: '<path d="M3.5 6.5 10 3l6.5 3.5v7L10 17l-6.5-3.5v-7Z"/><path d="m3.5 6.5 6.5 3.5 6.5-3.5M10 10v7"/>',
};
const ico = (k, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const pair = (name, value, size = 't-title', extra = '') => `<div class="type-pair"><span class="t-mono">${name}</span><span class="${size} tnum">${value}</span>${extra}</div>`;
const sparkPath = (v) => { const max = Math.max(...v), min = Math.min(...v); return v.map((y, i) => `${i ? 'L' : 'M'}${(i / (v.length - 1) * 62 + 1).toFixed(1)} ${(19 - (y - min) / (max - min || 1) * 18).toFixed(1)}`).join(' '); };
const barcode = () => { let x = 0, r = ''; const w = [2, 1, 3, 1, 1, 2, 1, 3, 2, 1, 1, 1, 3, 2, 1, 2, 1, 1, 3, 1, 2, 2, 1, 3, 1, 1, 2, 1, 3, 2, 1, 1, 2, 3, 1, 2, 1, 1, 2, 1]; w.forEach((n, i) => { if (i % 2 === 0) r += `<rect x="${x}" y="0" width="${n}" height="48"/>`; x += n + 1; }); return `<svg viewBox="0 0 ${x} 48" preserveAspectRatio="none" aria-hidden="true" fill="currentColor">${r}</svg>`; };

// The gaps: every part the library had no answer for. Numbered in the
// order a reader meets them; data-gap on an element ties it here.
const GAPS = {
  frame: ['What a widget sits in', 'The system has the stage (a ground for a hero) and the card (for content). A widget is a small tool shown as an object: either fits, neither is ruled, and the two read very differently in a set. Switch Frame to compare.'],
  budget: ['Four type styles in one widget', 'The pass, the weather and the activity widget each want a Display figure, mono names, Title figures and Body. The rule is three styles to a card. Either the rule bends for a widget, or one of those goes.'],
  route: ['A route between two places', 'A line with a mark on it between an origin and a destination. Dotted lines mean chart guides and dashed means provisional, so this one is a plain hairline with a plane over it.'],
  tear: ['A tear line', 'The stub of a ticket. Drawn as a dashed rule edge to edge, which borrows dashed’s meaning (provisional) for something that isn’t.'],
  code: ['A machine-readable code', 'A barcode or QR block: its size, its quiet zone, full ink, and the line under it.'],
  icons: ['A drawn icon set', 'The icon rules exist (three sizes, one stroke, round, current colour) but no icons do. Weather, transport, media and parcel marks were drawn by hand here.'],
  strip: ['A strip that scrolls sideways', 'Hourly tiles in one row. The carousel shows one item at a time and the scroll fade only fades top and bottom, so the side fade here is hand-made.'],
  range: ['A range on a track', 'Low to high on a shared scale: a thin track with an ink segment. The slider’s track is an input, not a reading, and is 16 tall.'],
  time: ['A time column', 'An agenda reads down its times. The list row leads with a circle, not a time, so the times sit in a column of their own.'],
  now: ['Now, in a list of times', 'Where the present falls between two events. A full-ink rule with the time, here; the accent is for attention, which this arguably is.'],
  stack: ['Overlapping avatars', 'Who is coming, as a stack of small circles, which needs a smaller size, an overlap, a ring of the ground and a solid fill. The system has no solid grey for it: the quiet fill is translucent, so overlaps show through; the stage grey (#f5f5f5) vanishes on a stage; the series grey (#d2d2d2) is solid but belongs to charts. Avatar fill compares them with a proposed solid grey, #e6e6e6 (#262626 dark): the quiet fill as it looks over the stage, made opaque.'],
  rank: ['A rank numeral', 'A position in an ordered list, as the row’s leading mark. Here a Title figure in secondary ink.'],
  spark: ['A sparkline outside a table', 'The table draws sparklines in cells; a row in a list has no cell, so this one is hand-drawn on the same spec.'],
  media: ['Playback: times and a play button', 'Elapsed and remaining under a scrubber, and a play button that turns into pause. The slider has no end labels and the icon button no toggled state.'],
  meter: ['Progress toward a goal', 'A reading, not a control: how far along. The slider’s track would invite a drag.'],
  timeline: ['Steps over time', 'Done, now and still to come, joined by a line. Built from the chip’s dot and a hairline.'],
  unread: ['An unread marker', 'A dot that means new. The chip’s dot means on or off, so the same mark would mean two things.'],
  bars: ['A bar chart', 'Values by day or by category. The line chart is the only chart.'],
  chart: ['A chart at widget size', 'The line chart is 240 tall on a phone, set in its script, and its value axis always starts at zero. A balance that moves 10% in a month draws as a flat line across the top of a tall, empty box.'],
  art: ['A media placeholder on the stage', 'An empty artwork slot is stage grey, so on a stage-grey widget it disappears.'],
};
const GAP_IDS = Object.keys(GAPS);
const gapNo = (id) => `G${GAP_IDS.indexOf(id) + 1}`;

const WIDGETS = [
  ['pass', 'Boarding pass', 'A flight, read at the gate', ['frame', 'budget', 'route', 'tear', 'code'], `
    <div class="pass-route">
      <div class="type-pair"><span class="t-mono">Lisbon</span><span class="t-display">LIS</span></div>
      <div class="pass-line" data-gap="route">${ico('plane')}</div>
      <div class="type-pair pass-to"><span class="t-mono">Porto</span><span class="t-display">OPO</span></div>
    </div>
    <div class="figures">${pair('Boards', '07:10')}${pair('Gate', '14')}${pair('Seat', '3A')}</div>
    <div class="pass-tear" data-gap="tear"></div>
    <div class="pass-code" data-gap="code">${barcode()}<p class="t-body">TAP 1361 · Justin Aguilar</p></div>`],
  ['weather', 'Weather', 'Now, the next hours and the week', ['budget', 'icons', 'strip', 'range'], `
    <div class="row-base">
      <div class="type-pair"><span class="t-mono">Lisbon</span><span class="t-display tnum">21°</span></div>
      <span data-gap="icons">${ico('sun')}</span>
    </div>
    <p class="t-body">Sunny, a breeze from the west. Rain from Thursday.</p>
    <div class="wx-hours" data-gap="strip">${[['Now', 'sun', 21], ['14', 'sun', 22], ['15', 'part', 22], ['16', 'part', 21], ['17', 'cloud', 19], ['18', 'cloud', 18], ['19', 'rain', 16], ['20', 'rain', 15]].map(([h, k, t]) => `<div class="wx-hour"><span class="t-mono">${h}</span>${ico(k)}<span class="t-body ink tnum">${t}°</span></div>`).join('')}</div>
    <ul class="wx-days">${[['Wed', 'sun', 14, 22], ['Thu', 'rain', 13, 17], ['Fri', 'rain', 12, 16], ['Sat', 'part', 13, 19], ['Sun', 'sun', 15, 23]].map(([d, k, lo, hi], i) => `<li class="wx-day"><span class="t-label">${d}</span>${ico(k)}<span class="t-body tnum">${lo}°</span><span class="range"${i === 0 ? ' data-gap="range"' : ''}><span style="left: ${(lo - 10) / 15 * 100}%; right: ${(25 - hi) / 15 * 100}%"></span></span><span class="t-body ink tnum">${hi}°</span></li>`).join('')}</ul>`],
  ['today', 'Today', 'A day’s calendar at a glance', ['time', 'now', 'stack'], `
    <div class="type-pair type-pair--loose"><h3 class="t-title">Tuesday 17</h3><p class="t-body">Four events. Free after four.</p></div>
    <ul class="agenda">

      <button class="icon-button" type="button" aria-label="Next">${ico('next')}</button>
    </div>`],
  ['activity', 'Activity', 'Today against a goal', ['budget', 'meter'], `
    ${pair('Steps today', '7,412', 't-display')}
    <div class="meter" data-gap="meter" role="meter" aria-valuenow="7412" aria-valuemax="10000" aria-label="Steps toward 10,000"><span style="width: 74%"></span></div>
    <p class="t-body">Of 10,000. 2,588 to go, about 25 minutes’ walk.</p>
    <div class="figures">${pair('Distance', '5.2 km')}${pair('Active', '48 min')}${pair('Floors', '6')}</div>`],
  ['parcel', 'Parcel', 'Where an order is', ['timeline', 'icons'], `
    <div class="row"><div class="type-pair"><span class="t-label">Arriving today</span><span class="t-body">Between 2 and 4pm</span></div><span data-gap="icons">${ico('box')}</span></div>
    <ol class="steps" data-gap="timeline">${[['Ordered', 'Nov 12', 'is-done'], ['Shipped from Madrid', 'Nov 13', 'is-done'], ['In Lisbon', 'Nov 16', 'is-done'], ['Out for delivery', '08:14', 'is-current'], ['Delivered', '', '']].map(([n, d, c]) => `<li class="step ${c}"><span class="step-dot"></span><span class="t-body">${n}</span><span class="t-mono">${d}</span></li>`).join('')}</ol>
    <button class="button-text link-quiet t-control" type="button" style="justify-self: start; margin-left: calc(-1 * var(--inset-control))">Show on a map</button>`],
  ['portfolio', 'Portfolio', 'A balance and its line', ['chart'], `
    ${pair('Balance', '$18,640', 't-display', '<span class="t-mono ink-gain">+$412 today</span>')}
    <div class="segmented" role="group" aria-label="Period"><span class="segmented-indicator" aria-hidden="true"></span>${['1D', '1W', '1M', '1Y'].map((p, i) => `<button class="segmented-option t-control${i === 2 ? ' is-active' : ''}" type="button" aria-pressed="${i === 2}">${p}</button>`).join('')}</div>
    <figure class="line-chart" aria-label="Balance over a month" data-legend="off" data-guides="none" data-prefix="$" data-gap="chart"><script type="application/json">${JSON.stringify({ x: Array.from({ length: 30 }, (_, i) => `Oct ${i + 18}`), series: [{ name: 'Balance', values: [16900, 17020, 16950, 17110, 17300, 17240, 17380, 17520, 17410, 17600, 17680, 17550, 17720, 17900, 17840, 17960, 18100, 18020, 18150, 18240, 18190, 18300, 18210, 18380, 18450, 18320, 18480, 18560, 18228, 18640] }] })}<\/script></figure>`],
  ['inbox', 'Inbox', 'The latest messages', ['unread'], `
    <ul class="list-rows">${[['MO', 'Mara Okafor', 'The flat has no lift, pack light.', '09:41', true], ['TL', 'Tomás Lima', 'Train tickets are booked.', '08:12', true], ['JA', 'Justin Aguilar', 'Sent the itinerary.', 'Mon', false]].map(([a, n, s, t, u], i) => `<li><button type="button" class="list-row"><span class="list-row-lead is-avatar t-control" aria-hidden="true">${a}</span><span class="list-row-body"><span class="list-row-name t-label">${n}</span><span class="list-row-value t-body tnum">${t}${u ? `<span class="unread"${i === 0 ? ' data-gap="unread"' : ''} aria-label="Unread"></span>` : ''}</span><span class="list-row-sub t-body">${s}</span></span></button></li>`).join('')}</ul>`],
  ['sleep', 'Sleep', 'Last night and the week', ['bars'], `
    ${pair('Last night', '7h 24m', 't-display', '<span class="t-body">In bed at 23:40, up at 07:10.</span>')}
    <div class="bars" data-gap="bars">${[['M', 6.5], ['T', 7.1], ['W', 5.8], ['T', 6.9], ['F', 8.2], ['S', 8.6], ['S', 7.4]].map(([d, h], i) => `<div class="bar${i === 6 ? ' is-focus' : ''}"><span style="height: ${h / 9 * 100}%" title="${h} hours"></span><span class="t-mono">${d}</span></div>`).join('')}</div>`],
  ['split', 'Split the bill', 'Who owes what — library only', [], `
    ${pair('Dinner at Taberna', '$186.40', 't-title')}
    <div class="row"><span class="t-label" id="split-l">Split between</span><div class="stepper surface surface--rest surface--pill" data-min="1" data-max="8"><button class="stepper-step" type="button" aria-label="Fewer"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><input class="stepper-input" inputmode="numeric" aria-labelledby="split-l" value="4"><button class="stepper-step" type="button" aria-label="More"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6M5 2v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div></div>
    <ul class="list-rows" style="margin-block: 0">${[['JA', 'You', 'Paid the bill', '$46.60'], ['MO', 'Mara', 'Owes you', '$46.60'], ['TL', 'Tomás', 'Owes you', '$46.60']].map(([a, n, s, v]) => `<li><div class="list-row"><span class="list-row-lead is-avatar t-control" aria-hidden="true">${a}</span><span class="list-row-body"><span class="list-row-name t-label">${n}</span><span class="list-row-value t-label tnum">${v}</span><span class="list-row-sub t-body">${s}</span></span></div></li>`).join('')}</ul>
    <button class="button button--large surface surface--rest surface--pill t-label" type="button">Request $139.80</button>`],
  ['timer', 'Focus timer', 'A countdown — library only', [], `
    <div class="segmented" role="group" aria-label="Mode" style="justify-self: center"><span class="segmented-indicator" aria-hidden="true"></span>${['Focus', 'Short break', 'Long break'].map((p, i) => `<button class="segmented-option t-control${i === 0 ? ' is-active' : ''}" type="button" aria-pressed="${i === 0}">${p}</button>`).join('')}</div>
    <div class="timer-face"><span class="t-display tnum">24:59</span><span class="t-body">Round 2 of 4</span></div>
    <div class="button-row button-row--center"><button class="button surface surface--rest surface--pill t-label" type="button">Start</button><button class="button-text link-quiet t-control" type="button">Reset</button></div>`],
];

document.getElementById('widgets').innerHTML = WIDGETS.map(([id, name, line, gaps, html]) => `
  <section class="tile" id="w-${id}" data-id="${id}" aria-label="${name}">
    <div class="widget" data-comment-target data-gaps="${gaps.includes('frame') ? 'frame' : ''}">${html}</div>
    <div class="tile-foot">
      <div class="tile-name"><h2 class="t-label">${name}</h2><p class="t-caption tile-gaps">${gaps.length ? [...gaps].sort((a, b) => GAP_IDS.indexOf(a) - GAP_IDS.indexOf(b)).map(gapNo).join(' · ') : 'No gaps — built from the library'}</p></div>
      <button class="button-text link-quiet t-control comment-btn" type="button" data-id="${id}">Comment</button>
    </div>
  </section>`).join('');

const used = (gid) => WIDGETS.filter((w) => w[3].includes(gid) || (gid === 'frame')).map((w) => w[1]);
const seg = (id, label, opts) => `
  <div class="control-field">
    <span class="t-mono" id="${id}-l">${label}</span>
    <div class="segmented" role="group" aria-labelledby="${id}-l" id="${id}">
      <span class="segmented-indicator" aria-hidden="true"></span>
      ${opts.map(([v, t]) => `<button class="segmented-option t-control${v === state[id] ? ' is-active' : ''}" type="button" aria-pressed="${v === state[id]}" value="${v}">${t}</button>`).join('')}
    </div>
  </div>`;
document.getElementById('sheet-body').innerHTML = `
  ${seg('frame', 'Frame', [['stage', 'Stage'], ['card', 'Card']])}
  ${seg('gaps', 'Outlines', [['off', 'Off'], ['on', 'On']])}
  ${seg('avatar', 'Avatar fill', [['quiet', 'Quiet'], ['solid', 'Solid'], ['series', 'Series']])}
  <div class="sheet-section">
    <p class="t-body sheet-note">Twelve widgets built from the library alone. Wherever it had no answer, the part was drawn on the page and is outlined, numbered to the list below. Comment on a widget with the button under it.</p>
  </div>
  <div class="sheet-section notes" id="notes" hidden>
    <h3 class="t-label" id="notes-title">Notes</h3>
    <textarea class="input input--area" id="notes-field" aria-labelledby="notes-title" placeholder="What works, what’s missing"></textarea>
    <span class="toast-anchor">
      <button class="button surface surface--rest surface--pill t-control" type="button" id="copy-notes" data-copy="" data-toast="Copied">Copy all notes</button>
      <span class="toast t-mono" role="status"></span>
    </span>
  </div>
  <div class="sheet-section">
    <h3 class="t-label">${GAP_IDS.length} gaps</h3>
    <ol class="gap-list">${GAP_IDS.map((g) => `
      <li class="gap-item">
        <span class="t-label">${gapNo(g)} ${GAPS[g][0]}</span>
        <p class="t-body sheet-note">${GAPS[g][1]}</p>
        ${g === 'frame' ? '<p class="t-caption sheet-note">In every widget</p>' : `<button class="button-text link-quiet t-control show-gap" type="button" data-gap="${g}">Show in ${WIDGETS.filter((w) => w[3].includes(g)).map((w) => w[1]).join(', ')}</button>`}
      </li>`).join('')}
    </ol>
  </div>`;
</script>
<script src="lib/components/segmented/segmented.js"></script>
<script src="lib/components/slider/slider.js"></script>
<script src="lib/components/stepper/stepper.js"></script>
<script src="lib/components/line-chart/line-chart.js"></script>
<script src="lib/components/toast/toast.js"></script>
<script src="lib/patterns/stage-sheet/stage-sheet.js"></script>
<script>
document.body.ontouchstart = () => {};
const set = document.getElementById('widgets');
const root = document.querySelector('.stage-sheet');
const host = document.querySelector('.stage-host');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ state, notes })); } catch {} };

// The outlines: a dashed box around each drawn part, numbered.
function outline() {
  set.querySelectorAll('.gap-box').forEach((b) => b.remove());
  if (state.gaps !== 'on') return;
  set.querySelectorAll('.widget').forEach((w) => {
    const wr = w.getBoundingClientRect();
    w.querySelectorAll('[data-gap]').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (!r.width) return;
      const box = document.createElement('span');
      box.className = 'gap-box';
      box.style.cssText = `left: ${r.left - wr.left - 4}px; top: ${r.top - wr.top - 4}px; width: ${r.width + 8}px; height: ${r.height + 8}px`;
      box.innerHTML = `<span class="t-mono">${gapNo(el.dataset.gap)}</span>`;
      w.append(box);
    });
  });
}
function apply() {
  set.classList.toggle('frame-card', state.frame === 'card');
  set.classList.toggle('frame-stage', state.frame === 'stage');
  set.classList.toggle('show-gaps', state.gaps === 'on');
  set.classList.toggle('avatar-quiet', state.avatar === 'quiet');
  set.classList.toggle('avatar-series', state.avatar === 'series');
  outline();
  save();
}
['frame', 'gaps', 'avatar'].forEach((k) => document.getElementById(k).addEventListener('segmented-change', (e) => { state[k] = e.detail.value; apply(); }));
new ResizeObserver(() => requestAnimationFrame(outline)).observe(set);
document.fonts?.ready.then(outline);

// Bring a widget into view: on a phone the open sheet covers the bottom,
// so the stage scrolls the widget to its top.
const reveal = (tile) => {
  set.querySelectorAll('.tile.is-current').forEach((t) => t.classList.toggle('is-current', t === tile));
  tile.classList.add('is-current');
  setTimeout(() => host.scrollTo({ top: tile.offsetTop - 24, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }), 500); // after the split
};
const openSheet = () => { const t = document.querySelector('.stage-sheet-toggle'); if (!root.classList.contains('is-open')) t.click(); };
document.getElementById('sheet-body').addEventListener('click', (e) => {
  const b = e.target.closest('.show-gap'); if (!b) return;
  if (state.gaps !== 'on') document.querySelector('#gaps button[value="on"]').click();
  const el = set.querySelector(`[data-gap="${b.dataset.gap}"]`);
  if (el) reveal(el.closest('.tile'));
});

// Comments. Where the page is published, a comment goes to the claude.ai
// comment thread on that widget, which reaches Claude. Opened locally, it
// is a note kept in this browser, copied out with one button.
let comments = null;
let current = null;
const field = document.getElementById('notes-field');
const notesBox = document.getElementById('notes');
const summarise = () => {
  const lines = WIDGETS.filter((w) => (notes[w[0]] || '').trim()).map((w) => `- ${w[1]}: ${notes[w[0]].trim()}`);
  document.getElementById('copy-notes').dataset.copy = lines.length ? `Widget notes\n${lines.join('\n')}\nFrame: ${state.frame}` : 'No notes yet.';
};
const noteOn = (id) => {
  current = id;
  const w = WIDGETS.find((x) => x[0] === id);
  notesBox.hidden = false;
  document.getElementById('notes-title').textContent = `Notes on ${w[1]}`;
  field.value = notes[id] || '';
  openSheet();
  setTimeout(() => field.focus({ preventScroll: true }), 900);
  notesBox.scrollIntoView({ block: 'nearest' });
};
field.addEventListener('input', () => { if (current) { notes[current] = field.value; summarise(); save(); } });
summarise();
window.claude?.use?.('comments').then((c) => { comments = c; }).catch(() => {});
set.addEventListener('click', async (e) => {
  const b = e.target.closest('.comment-btn'); if (!b) return;
  const tile = b.closest('.tile');
  set.querySelectorAll('.tile').forEach((t) => t.classList.toggle('is-current', t === tile));
  if (comments) {
    try {
      const r = await comments.openComposer({ element: tile.querySelector('.widget') });
      if (r.opened) return;
    } catch { comments = null; }
  }
  noteOn(b.dataset.id);
  reveal(tile);
});

// Small behaviours so the widgets feel real.
document.querySelector('.np-play')?.addEventListener('click', (e) => {
  const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Pause' : 'Play');
  b.innerHTML = ico(on ? 'pause' : 'play');
});

apply();
</script>

</html>
