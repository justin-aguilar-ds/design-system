<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Register Explorer</title>
<script>try { const t = localStorage.getItem('ps-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>

<link rel="stylesheet" href="lib/components/button/button.css">
<link rel="stylesheet" href="lib/components/segmented/segmented.css">

<style>
  /* A temporary tool: a register slider, and a screen that recomposes. */
  h1, h2, h3, h4, p { margin: 0; }
  body { background: var(--color-bg); }
  /* The explorer is a stage and sheet: the screen is the stage, the
     controls, readout and ideas are in the sheet. */
  .sheet-section { display: grid; gap: var(--space-16); padding-top: var(--space-24); border-top: 1px solid var(--color-divider); }
  .slider-ends { display: flex; justify-content: space-between; }
  .readout-note { color: var(--color-text-secondary); }
  .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-16); }
  .pair { display: grid; gap: var(--space-4); }
  .pair .t-body { color: var(--color-text); }
  .carries { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-8); }
  .carries li { display: grid; gap: var(--space-4); }
  .carries .t-body { color: var(--color-text); }

  /* ---- The stage: the screen at its real size, scaled to fit the room
     the stage has. On a wide screen the open sheet takes the corner, so
     the screen fits the room beside it. */
  .stage-host {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: var(--space-24);
    transition: padding var(--duration-deliberate) var(--ease-out);
  }
  @container stage-sheet (min-width: 631px) {
    .stage-sheet.is-open .stage-host { padding-right: calc(280px + 2 * var(--space-page)); }
  }
  /* On a phone the closed pill sits over the stage: the screen ends above it. */
  @container stage-sheet (max-width: 630px) {
    .stage-sheet:not(.is-open) .stage-host { padding-bottom: calc(var(--height-slot) + 2 * var(--space-page)); }
  }
  .screen-box { position: relative; }
  .screen {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    overflow: hidden auto;
    container: screen / size;
    background: var(--color-bg);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-card);
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* The type in the screen follows the screen's size, not this window's. */
  .screen.is-phone .t-display { font-size: 32px; line-height: 1.2; }
  .screen.is-phone .t-title { font-size: 24px; line-height: 1.2; }
  .screen.is-desktop .t-display { font-size: 56px; line-height: 64px; }
  .screen.is-desktop .t-title { font-size: 32px; line-height: 38px; }

  /* ============================================================
     THE MOCK PAGE. Every distance comes from the register:
     --m-inset (sides), --m-block (top and bottom), --m-section (between
     groups). The main group centres in the room left over when the
     register fits to the screen and the content allows it.
     ============================================================ */
  .m {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: var(--m-block) var(--m-inset) var(--m-pad-b);
    transition: opacity var(--duration-fast) ease;
  }
  .m.is-swapping { opacity: 0; }
  .m-main { display: flex; flex-direction: column; gap: var(--m-section); padding-block: var(--m-gap-inner); }
  /* Max width: the head and main sit in a centred column; the slot keeps the screen. */
  .m-head, .m-intro, .m-main { width: 100%; max-width: var(--m-maxw, none); margin-inline: auto; }

  /* Compositions. Stack: fixed gaps, the group centred. The others fill
     the room between the header and the slot, and the space between the
     title, the hero and the supporting content is what's left over. */
  .m.is-fit.comp-stack .m-main { margin-block: auto; }
  .m.is-fit:not(.comp-stack) .m-main { flex: 1; }
  .m.is-fit.comp-centre .m-main { display: grid; grid-template-rows: auto 1fr auto; }
  .m.is-fit.comp-centre [data-role="hero"] { align-self: center; }
  .m.is-fit.comp-top [data-role="support"] { margin-top: auto; }
  .m.is-fit.comp-bottom [data-role="hero"] { margin-top: auto; }
  .m-head { display: flex; justify-content: space-between; align-items: start; gap: var(--space-16); }
  .m-head p { max-width: 30ch; }
  .m-quiet { color: var(--color-text-secondary); }
  .m-stack { display: grid; gap: var(--space-8); }
  .m-center { text-align: center; justify-items: center; }

  /* Expressive: the carousel, sized from the screen. */
  .m-carousel { display: flex; align-items: center; justify-content: center; gap: var(--space-24); }
  .m-card {
    flex: none;
    display: grid;
    align-content: start;
    padding: var(--space-24);
    width: min(60cqw, 28cqh);
    aspect-ratio: 4 / 5;
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-lift);
    transition: translate var(--duration-pop) var(--ease-out), rotate var(--duration-pop) var(--ease-out);
  }
  .m-card.is-side { opacity: 0.2; width: min(40cqw, 20cqh); box-shadow: none; }
  .m-card:not(.is-side):hover { translate: 0 calc(-1 * var(--space-4)); rotate: -1deg; }

  /* Showcase: one piece of work. */
  .m-media { width: 100%; aspect-ratio: 16 / 10; display: grid; place-items: center; border: 1px solid var(--color-hairline); border-radius: var(--radius-card); }
  .is-desktop .m-media { width: min(100%, 720px); margin-inline: auto; }

  /* Page: a statement, then a list on dividers. */
  .m-list { display: grid; }
  .m-row { display: grid; gap: var(--space-4); padding-block: var(--space-16); border-top: 1px solid var(--color-divider); }
  .m-row:first-child { border-top: 0; padding-top: 0; }

  /* Workspace and tool: intro, panel row, figures, chart, table. */
  .m-intro { display: flex; justify-content: space-between; align-items: center; gap: var(--space-16); }
  .m-info { flex: none; width: var(--height-control); height: var(--height-control); display: grid; place-items: center; border-radius: var(--radius-pill); }
  .m-info svg { width: var(--icon-inline); height: var(--icon-inline); }
  .m-panel { display: flex; align-items: center; justify-content: space-between; min-height: var(--height-row); padding: 0 var(--inset-control); border-radius: var(--radius-row); }
  .m-panel svg, .m-pill svg { width: var(--icon-mark); height: var(--icon-mark); color: var(--color-text-secondary); }
  .m-figures { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--m-gap-inner); }
  .is-desktop .m-figures { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .m-chart { width: 100%; height: auto; display: block; }
  .m-chart path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m-table { width: 100%; border-collapse: collapse; }
  .m-table th, .m-table td { text-align: left; padding: var(--m-row-pad) var(--space-8) var(--m-row-pad) 0; border-top: 1px solid var(--color-divider); }
  .m-table th { border-top: 0; }
  .m-table .num { text-align: right; padding-right: 0; font-variant-numeric: tabular-nums; }
  .m-split { display: grid; gap: var(--m-section); }
  .is-desktop .m-split.is-two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }

  /* The bottom slot, drawn in the screen (the real one is fixed to the window). */
  .m-slot { position: sticky; bottom: var(--m-inset-b); margin-top: auto; display: flex; justify-content: center; gap: var(--space-8); pointer-events: none; }
  .m-slot > * { pointer-events: auto; }
  .m.is-fit .m-slot { margin-top: 0; }
  .m .segmented-option.is-indicated { opacity: 1; background: var(--color-fill-subtle); }
  .m-big { min-height: var(--height-slot); padding: 0 var(--inset-slot); justify-content: center; }
  .is-phone .m-slot .m-big:only-child { flex: 1; }
  .m-pill { display: inline-flex; align-items: center; gap: var(--gap-mark); min-height: var(--height-row); padding: 0 var(--inset-control); border-radius: var(--radius-row); }
  .m-corner { position: sticky; bottom: var(--space-page); margin-top: auto; display: flex; justify-content: flex-end; }

  /* ---- Show space: the register's distances, marked in the screen. */
  .show-space [data-gap] { position: relative; }
  .show-space [data-gap]::before {
    content: attr(data-gap);
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    height: var(--gap-h);
    display: grid;
    place-items: center;
    background: var(--color-accent-soft);
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--color-accent-ink);
    pointer-events: none;
  }
  .show-space .m { box-shadow: inset var(--m-inset) 0 0 var(--color-accent-soft), inset calc(-1 * var(--m-inset)) 0 0 var(--color-accent-soft); }

  /* ---- The ideas. */
  .proposals { margin: 0; padding: 0; list-style: none; }
  .proposal { display: grid; gap: var(--space-16); padding-block: var(--space-16); border-top: 1px solid var(--color-divider); }
  .proposal:first-child { border-top: 0; padding-top: 0; }
  .proposal > .segmented { justify-self: start; }
  .proposal-copy { display: grid; gap: var(--space-8); }
  .proposal-copy .t-body { max-width: 60ch; }
  .proposal.is-declined .proposal-copy { opacity: var(--opacity-label-inactive); }
  .decisions-end { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-16); }
</style>
</head>
<body ontouchstart>
<div class="stage-sheet">
  <section class="stage-sheet-stage" aria-label="Screen">
    <div class="stage-host" id="stage">
      <div class="screen-box" id="screen-box">
        <div class="screen is-phone" id="screen"></div>
      </div>
    </div>
  </section>

  <section class="stage-sheet-sheet" aria-label="Controls">
    <button class="stage-sheet-toggle" type="button" aria-expanded="false" aria-controls="sheet-body">
      <span class="stage-sheet-title t-mono">Controls</span>
      <svg class="stage-sheet-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="stage-sheet-body" id="sheet-body">
      <div class="slider-field">
        <div class="slider-head">
          <label class="t-mono" for="register">Register</label>
          <output class="slider-value t-mono" for="register" id="register-out">Expressive</output>
        </div>
        <span class="slider">
          <span class="slider-track" aria-hidden="true"><span class="slider-progress"></span></span>
          <input class="slider-input" id="register" type="range" min="0" max="4" step="1" value="0">
        </span>
        <div class="slider-ends"><span class="t-mono">Expressive</span><span class="t-mono">Tool</span></div>
      </div>
      <div class="control-field">
        <span class="t-mono" id="content-l">Content</span>
        <div class="segmented" role="group" aria-labelledby="content-l" id="content">
          <span class="segmented-indicator" aria-hidden="true"></span>
          <button class="segmented-option t-control" type="button" aria-pressed="false" value="0">Little</button>
          <button class="segmented-option t-control is-active" type="button" aria-pressed="true" value="1">Some</button>
          <button class="segmented-option t-control" type="button" aria-pressed="false" value="2">Lots</button>
        </div>
      </div>
      <div class="control-field">
        <span class="t-mono" id="screen-l">Screen</span>
        <div class="segmented" role="group" aria-labelledby="screen-l" id="screen-size">
          <span class="segmented-indicator" aria-hidden="true"></span>
          <button class="segmented-option t-control is-active" type="button" aria-pressed="true" value="phone">Phone</button>
          <button class="segmented-option t-control" type="button" aria-pressed="false" value="desktop">Desktop</button>
        </div>
      </div>
      <div class="picker-field">
        <span class="t-mono" id="comp-l">Composition</span>
        <div class="picker" id="comp">
          <button class="picker-trigger button surface surface--rest surface--pill t-control" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="comp-list" aria-labelledby="comp-l comp-v">
            <span class="picker-value" id="comp-v">Centre</span>
            <svg class="picker-chevron" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="picker-menu" hidden>
            <ul class="picker-list" id="comp-list" role="listbox" tabindex="-1" aria-labelledby="comp-l">
              <li class="picker-option t-control" role="option" aria-selected="false" data-value="stack">Stack</li>
              <li class="picker-option t-control" role="option" aria-selected="true" data-value="centre">Centre</li>
              <li class="picker-option t-control" role="option" aria-selected="false" data-value="top">Top</li>
              <li class="picker-option t-control" role="option" aria-selected="false" data-value="bottom">Bottom</li>
            </ul>
          </div>
        </div>
      </div>
      <div class="control-field">
        <span class="t-mono" id="maxw-l">Max width</span>
        <div class="segmented" role="group" aria-labelledby="maxw-l" id="maxw">
          <span class="segmented-indicator" aria-hidden="true"></span>
          <button class="segmented-option t-control is-active" type="button" aria-pressed="true" value="0">Off</button>
          <button class="segmented-option t-control" type="button" aria-pressed="false" value="1280">1280</button>
          <button class="segmented-option t-control" type="button" aria-pressed="false" value="720">720</button>
        </div>
      </div>
      <div class="control-field">
        <span class="t-mono" id="space-l">Show space</span>
        <div class="segmented" role="group" aria-labelledby="space-l" id="show-space">
          <span class="segmented-indicator" aria-hidden="true"></span>
          <button class="segmented-option t-control is-active" type="button" aria-pressed="true" value="off">Off</button>
          <button class="segmented-option t-control" type="button" aria-pressed="false" value="on">On</button>
        </div>
      </div>

      <div class="sheet-section" aria-live="polite">
        <h2 class="t-label" id="r-name">Expressive</h2>
        <p class="t-body readout-note" id="r-note"></p>
        <div class="readout-grid" id="r-grid"></div>
        <ul class="carries" id="r-carries"></ul>
        <p class="t-mono" id="fold-note"></p>
      </div>

      <div class="sheet-section">
        <h2 class="t-label">The ideas</h2>
        <ol class="proposals" id="proposals"></ol>
        <p class="t-body readout-note" id="decision-summary"></p>
        <span class="toast-anchor">
          <button class="button surface surface--rest surface--pill t-control" type="button" id="copy-decisions" data-copy="" data-toast="Copied">Copy my decisions</button>
          <span class="toast t-mono" role="status"></span>
        </span>
      </div>
    </div>
  </section>
</div>

<script>
const PROPOSALS = [
  ['R1', 'Five registers, Expressive to Tool', 'Expressive, Showcase, Page, Workspace and Tool, each a layout recipe in SKILL.md: what it is for, how many things share the screen, its distances, and its hero. A brief names its register before anything is built; the register picks the recipe, the components stay the same.'],
  ['R2', 'A 96 step, for the expressive end', 'A sixth spacing step, --space-96, used only between groups at Expressive and Showcase. And a role token, --space-section, that the register sets: 96, 96, 48, 48, 24. Components never read 96; layouts do.'],
  ['R3', 'Wider sides on a wide screen, at the expressive end', 'Expressive, Showcase and Page take 48 at the sides on a wide screen, so the work sits inside a frame of air. Workspace and Tool keep 24 for the room. Phones keep 24 at every register.'],
  ['R4', 'Fit to the screen', 'When the content fits one screen, the main group centres in the room between the header and the bottom slot, so a page with little on it reads as composed, not unfinished. Expressive, Showcase and Page fit; Workspace and Tool stay top-aligned, because a tool is read from the top. Try Page with Little content.'],
  ['R5', 'One hero, front and centre', 'The expressive end has exactly one hero: the tool’s focus, a component, or display type. It is sized from the screen (a share of its width and height), not a fixed number, so it fills a phone and a desktop alike. Everything else steps back to secondary ink.'],
  ['R7', 'Compose the room: title, hero, support', 'At the expressive end a screen is composed in three parts: a title at the top, the hero, and its supporting content at the bottom. The space between them isn’t a token: it is the room left between the header and the bottom slot, shared out by the composition. Centre puts the hero midway; Top keeps the title and hero together with the support at the bottom; Bottom brings the hero down to its support. --space-section is the least it can shrink to. Tools always stack. Try them with Composition.'],
  ['R8', 'A reading width for text at the expressive end', 'On a wide screen, a register with text to read (Showcase, Page) centres its head and content in a 720px column, a new --container-read; --container (1280) stays the outer limit for everything. Expressive heroes and tools run the full width inside the inset. Phones are narrower than both, so nothing changes there.'],
  ['R6', 'Interaction is the constant', 'Hover lift, tooltips, the pop and reveal timings and the tap response are the same at every register. Expression at the tool end comes from them and from precision; it never comes from denser motion or louder colour.'],
];
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem('register-proposals') || '{}'); } catch {}
document.getElementById('proposals').innerHTML = PROPOSALS.map(([id, title, body]) => `
  <li class="proposal${decisions[id] === 'decline' ? ' is-declined' : ''}" data-id="${id}">
    <div class="proposal-copy">
      <span class="t-mono">${id}</span>
      <h3 class="t-label">${title}</h3>
      <p class="t-body">${body}</p>
    </div>
    <div class="segmented" role="group" aria-label="${id} decision">
      <span class="segmented-indicator" aria-hidden="true"></span>
      ${['pending', 'approve', 'decline'].map((val) => `<button class="segmented-option t-control${(decisions[id] || 'pending') === val ? ' is-active' : ''}" type="button" aria-pressed="${(decisions[id] || 'pending') === val}" value="${val}">${val[0].toUpperCase() + val.slice(1)}</button>`).join('')}
    </div>
  </li>`).join('');
</script>

<script>
document.body.ontouchstart = () => {};

// ---- The registers. Distances are in px; phone | desktop where they differ.
const REG = [
  { name: 'Expressive', fit: true, inset: [24, 48], block: [24, 24], section: 96, inner: 24, rowPad: 16,
    note: 'One thing, front and centre. Personal software with a single job: a type toy, a mix, a card. The layout is the design.',
    things: '1 hero, a header line, the nav', hero: 'A component, sized from the screen',
    carries: [['Layout', 'The hero fills the screen between the header and the nav'], ['Space', '96 around the hero; the edges frame it'], ['Motion', 'The hero lifts and sways under a finger']] },
  { name: 'Showcase', fit: true, inset: [24, 48], block: [24, 24], section: 96, inner: 24, rowPad: 16,
    note: 'One piece of work at a time, with a caption. A portfolio page, a launch, a single result.',
    things: '1 hero, a caption, a header, the nav', hero: 'A piece of media, as wide as the column',
    carries: [['Layout', 'The work centred, the caption under it'], ['Space', '96 between the header, the work and the caption'], ['Type', 'Quiet: secondary ink everywhere but the work']] },
  { name: 'Page', fit: true, inset: [24, 48], block: [48, 48], section: 48, inner: 16, rowPad: 16,
    note: 'Something to read and one thing to do. An about page, an invitation, a menu.',
    things: 'A statement, a list, one action', hero: 'Display type',
    carries: [['Type', 'A display statement carries the page'], ['Space', '48 between groups, 16 inside the list'], ['Layout', 'With little content it centres; with lots it reads from the top']] },
  { name: 'Workspace', fit: false, inset: [24, 24], block: [48, 48], section: 48, inner: 24, rowPad: 16,
    note: 'A tool with one main view. A planner, a calculator, a tracker you check.',
    things: 'Intro, panel, figures, a chart', hero: 'The main view: a chart or a list',
    carries: [['Layout', 'Top-aligned: read from the title down'], ['Space', '48 between sections, 24 inside them'], ['Interaction', 'Hover, tooltips and focus carry the feel']] },
  { name: 'Tool', fit: false, inset: [24, 24], block: [48, 48], section: 24, inner: 16, rowPad: 8,
    note: 'Dense and precise, still designed. A league tool, a dashboard, a ledger. Precision is the expression.',
    things: 'Intro, docked panel, figures, chart, table', hero: 'The data itself',
    carries: [['Space', '24 between sections, the table at its tightest'], ['Layout', 'Two columns on a wide screen; the panel docked to the corner'], ['Interaction', 'The same hover, tooltip and timing as Expressive']] },
];
const SIZES = { phone: [390, 844], desktop: [1440, 900] };
const state = { r: 0, content: 1, size: 'phone', space: false, comp: 'centre', maxw: 0 };
// The max width each register suggests; the control follows the register.
const MAXW = [0, 720, 720, 0, 0];
const COMP_NOTE = { stack: 'Fixed gaps; the group centred in the room', centre: 'Title at the top, support at the bottom, the hero centred between', top: 'Title and hero at the top; support at the bottom', bottom: 'Title at the top; hero and support at the bottom' };

const CHEV = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV_DOWN = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW = '<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 5h6M5.5 2.5 8 5 5.5 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const INFO = '<span class="m-info surface surface--rest" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="4.25" r="1.25" fill="currentColor"/><path d="M8 7.25v5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg></span>';
const nav = (a, b, on = 0) => `<div class="segmented segmented--large" aria-hidden="true"><span class="segmented-indicator" style="opacity:0"></span><span class="segmented-option t-label${on === 0 ? ' is-indicated' : ''}">${a}</span><span class="segmented-option t-label${on === 1 ? ' is-indicated' : ''}">${b}</span></div>`;
const head = (right = 'About', sub = '') => `<div class="m-head"><div class="m-stack"><span class="t-body m-quiet">Studio Folio</span>${sub ? `<p class="t-body m-quiet">${sub}</p>` : ''}</div><span class="t-body m-quiet">${right}</span></div>`;

// A chart: one series in ink, two quiet ones in the series grey.
const chart = (w, h) => {
  const line = (seed, amp) => { let d = ''; for (let i = 0; i <= 12; i++) { const x = (i / 12) * w, y = h * 0.55 - Math.sin(i * 0.7 + seed) * amp - i * (h * 0.02); d += `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`; } return d; };
  return `<svg class="m-chart" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    ${[0.25, 0.5, 0.75].map((f) => `<line x1="0" x2="${w}" y1="${h * f}" y2="${h * f}" stroke="var(--color-hairline-strong)" stroke-dasharray="0 4" stroke-linecap="round"/>`).join('')}
    <path d="${line(2, h * 0.12)}" stroke="var(--color-series)" stroke-width="2.25"/>
    <path d="${line(4, h * 0.1)}" stroke="var(--color-series)" stroke-width="2.25"/>
    <path d="${line(0, h * 0.18)}" stroke="var(--color-text)" stroke-width="3.25"/></svg>`;
};
const PEOPLE = ['Ana Ruiz', 'Ben Okafor', 'Chloe Park', 'Dev Shah', 'Eli Moreau', 'Fay Lin', 'Gus Romero', 'Hana Ito', 'Ivo Petrov', 'Jun Ahn', 'Kai Berg', 'Lia Costa', 'Max Ross', 'Nia Cole', 'Omar Haddad', 'Pia Lund', 'Quinn Ray', 'Rex Hale', 'Sol Vega', 'Tao Wen'];
const table = (rows) => `<table class="m-table"><thead><tr><th class="t-label">Player</th><th class="t-label">Team</th><th class="t-label num">Pts</th></tr></thead><tbody>${PEOPLE.slice(0, rows).map((p, i) => `<tr><td class="t-body">${p}</td><td class="t-mono">${['NYK', 'BOS', 'DEN', 'LAL', 'MIA'][i % 5]}</td><td class="t-mono num">${(48.2 - i * 1.7).toFixed(1)}</td></tr>`).join('')}</tbody></table>`;
const figures = (n) => `<div class="m-figures">${[['Points', '1,284'], ['Rank', '3rd'], ['Win rate', '64%'], ['Trades', '12']].slice(0, n).map(([k, v]) => `<div class="m-stack"><span class="t-mono">${k}</span><span class="t-title">${v}</span></div>`).join('')}</div>`;

const RENDER = [
  // Expressive
  (c, d) => {
    const cards = c === 0 ? 1 : d && c === 2 ? 5 : 3;
    const side = (cards - 1) / 2;
    const card = (i) => `<div class="m-card${i === side ? '' : ' is-side'}"><span class="t-title">${i === side ? 'Episode 12' : 'Episode'}</span></div>`;
    return { head: head(),
      title: `<div class="m-stack"><span class="t-mono">Side A</span><span class="t-title">Stay Home Radio</span></div>`,
      hero: `<div class="m-carousel">${Array.from({ length: cards }, (_, i) => card(i)).join('')}</div>`,
      support: `<div class="m-stack m-center"><p class="t-body m-quiet">Episode 12 · 58 min</p>${c ? '<p class="t-body m-quiet">Soul, jazz and late-night instrumentals</p>' : ''}</div>`,
      slot: nav('Design', 'Music', 1) };
  },
  // Showcase
  (c) => {
    const media = (t) => `<div class="m-media"><div class="m-stack m-center"><span class="t-label m-quiet">Introducing</span><span class="t-label">${t}</span></div></div>`;
    const caption = (y) => `<div class="m-stack m-center"><p class="t-body m-quiet">Visual refresh</p><p class="t-body m-quiet">Studio · ${y}</p></div>`;
    const more = c === 2 ? [['Field Guide', 2025], ['Night Market', 2024]].map(([t, y]) => media(t) + caption(y)).join('') : '';
    return { head: head(),
      title: `<p class="t-body m-quiet">${c ? 'Product designer, making tools and type for people who read closely.' : 'Product designer.'}</p>`,
      hero: media('New Sans'),
      support: `<div class="m-stack" style="gap: var(--m-section)">${caption(2026)}${more}</div>`,
      slot: nav('Design', 'Music', 0) };
  },
  // Page
  (c) => {
    const rows = [['2023—Present', 'North Studio'], ['2021—2022', 'Court Labs'], ['2018—2021', 'Market Co'], ['2015—2018', 'Paper Works'], ['2013—2015', 'Field Office'], ['2011—2013', 'Line & Grid'], ['2010—2011', 'Small Press'], ['2009—2010', 'First Desk']].slice(0, [2, 4, 8][c]);
    return {
      head: `<div class="m-head"><span></span><span class="t-body m-quiet">Close</span></div>`,
      title: `<span class="t-mono">About</span>`,
      hero: `<div class="m-stack" style="gap: var(--m-gap-inner)"><p class="t-display">A product designer who makes small tools.</p>${c ? '<p class="t-display">Having fun with prototypes.</p>' : ''}</div>`,
      support: `<div class="m-list">${rows.map(([y, n]) => `<div class="m-row"><span class="t-mono">${y}</span><span class="t-title">${n}</span></div>`).join('')}</div>`,
      slot: `<button class="button surface surface--rest surface--pill t-label m-big" type="button">Copy email</button>`,
    };
  },
  // Workspace
  (c, d) => ({
    head: `<div class="m-intro"><h4 class="t-display">Weekly plan</h4>${INFO}</div>`,
    main: `<div class="m-panel surface surface--rest"><span class="t-mono">Controls</span>${CHEV_DOWN}</div>
      ${c ? figures(2) : ''}
      <div class="m-split${d && c === 2 ? ' is-two' : ''}"><div class="m-stack" style="gap: var(--m-gap-inner)"><span class="t-label">Hours by day</span>${chart(d ? 720 : 340, d ? 260 : 180)}</div>${c === 2 ? `<div class="m-stack" style="gap: var(--m-gap-inner)"><span class="t-label">This week</span>${table(6)}</div>` : ''}</div>`,
    slot: '',
  }),
  // Tool
  (c, d) => ({
    head: `<div class="m-intro"><h4 class="t-display">What-if league</h4>${INFO}</div>`,
    main: `${figures(4)}
      <div class="m-split${d ? ' is-two' : ''}"><div class="m-stack" style="gap: var(--m-gap-inner)"><span class="t-label">Projected points</span>${chart(d ? 620 : 340, d ? 240 : 160)}</div>
      <div class="m-stack" style="gap: var(--m-gap-inner)"><span class="t-label">Roster</span>${table([4, 10, 20][c])}</div></div>`,
    corner: `<span class="m-pill surface surface--rest"><span class="t-mono">Controls</span>${CHEV}</span>`,
  }),
];

const screen = document.getElementById('screen');
const box = document.getElementById('screen-box');
const stage = document.getElementById('stage');
const fit = () => {
  const [w, h] = SIZES[state.size];
  const cs = getComputedStyle(stage);
  const W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(0.05, Math.min(1, W / w, H / h));
  screen.style.width = `${w}px`;
  screen.style.height = `${h}px`;
  screen.style.transform = `scale(${s})`;
  box.style.width = `${w * s}px`;
  box.style.height = `${h * s}px`;
};

function render() {
  const reg = REG[state.r], d = state.size === 'desktop', k = d ? 1 : 0;
  const parts = RENDER[state.r](state.content, d);
  const main = parts.main ?? ['title', 'hero', 'support'].map((r) => `<div class="m-part" data-role="${r}">${parts[r]}</div>`).join('');
  screen.className = `screen is-${state.size}${state.space ? ' show-space' : ''}`;
  // A bottom slot is always the page inset from the bottom edge, whatever the register's block.
  const padB = parts.slot ? 24 : reg.block[k];
  const vars = `--m-inset:${reg.inset[k]}px;--m-block:${reg.block[k]}px;--m-pad-b:${padB}px;--m-section:${reg.section}px;--m-gap-inner:${reg.inner}px;--m-row-pad:${reg.rowPad}px;--m-inset-b:24px${state.maxw ? `;--m-maxw:${state.maxw}px` : ''}`;
  screen.innerHTML = `<div class="m${reg.fit ? ' is-fit' : ''} comp-${state.comp}" style="${vars}">${parts.head}<div class="m-main">${main}</div>${parts.slot ? `<div class="m-slot">${parts.slot}</div>` : ''}${parts.corner ? `<div class="m-corner">${parts.corner}</div>` : ''}</div>`;
  screen.scrollTop = 0;
  requestAnimationFrame(() => { markGaps(); readout(reg, k); });
}

// The space between each group and the one before it, measured: a fixed
// gap reads as its number, a gap that takes the room left over as auto.
let gaps = [];
function markGaps() {
  const reg = REG[state.r];
  const k = screen.getBoundingClientRect().height / screen.offsetHeight || 1;
  const main = screen.querySelector('.m-main');
  if (!main) return;
  let prev = screen.querySelector('.m-head, .m-intro');
  gaps = [];
  [...main.children].forEach((el) => {
    const g = prev ? Math.round((el.getBoundingClientRect().top - prev.getBoundingClientRect().bottom) / k) : reg.section;
    const auto = reg.fit && state.comp !== 'stack' ? g > reg.section + 1 : g > reg.section * 2 + 1;
    el.dataset.gap = auto ? `auto · ${g}` : g;
    el.style.setProperty('--gap-h', `${g}px`);
    gaps.push([el.dataset.role || 'group', g, auto]);
    prev = el;
  });
}
const refresh = () => { markGaps(); readout(REG[state.r], state.size === 'desktop' ? 1 : 0); };

function readout(reg, k) {
  document.getElementById('register-out').textContent = reg.name;
  document.getElementById('r-name').textContent = reg.name;
  document.getElementById('r-note').textContent = reg.note;
  const comp = reg.fit ? COMP_NOTE[state.comp] : 'Tools stack: fixed gaps, read from the top';
  const measured = gaps.filter(([r]) => r !== 'group' && r !== 'title').map(([r, g, a]) => `${r === 'hero' ? 'Above the hero' : 'Above the support'} ${a ? `${g} (room left)` : g}`).join(' · ');
  const pairs = [['Between groups', reg.fit && state.comp !== 'stack' ? `${reg.section} at least, then the room left` : reg.section], ['Sides', reg.inset[k]], ['Top and bottom', reg.block[k]], ['Max width', state.maxw ? `${state.maxw}, centred` : 'None: the inset only'], ['On screen', reg.things], ['Hero', reg.hero], ['Composition', comp], ['Measured', measured || '—']];
  document.getElementById('r-grid').innerHTML = pairs.map(([n, v]) => `<div class="pair"><span class="t-mono">${n}</span><span class="t-body">${v}</span></div>`).join('');
  document.getElementById('r-carries').innerHTML = reg.carries.map(([n, v]) => `<li><span class="t-mono">${n}</span><span class="t-body">${v}</span></li>`).join('');
  requestAnimationFrame(() => {
    const over = screen.scrollHeight - screen.clientHeight;
    const n = (screen.scrollHeight / screen.clientHeight);
    document.getElementById('fold-note').textContent = over <= 1
      ? (reg.fit ? 'Fits one screen · centred in the room left' : 'Fits one screen · top-aligned, a tool reads from the top')
      : `${n.toFixed(1)} screens · scroll inside the screen`;
  });
}

const swap = () => {
  const m = screen.querySelector('.m');
  if (!m) { render(); return; }
  m.classList.add('is-swapping');
  setTimeout(render, 160);
};

document.getElementById('register').addEventListener('input', (e) => {
  state.r = Number(e.target.value);
  // The max width follows the register's suggestion.
  const want = String(MAXW[state.r]);
  const opt = document.querySelector(`#maxw .segmented-option[value="${want}"]`);
  state.maxw = MAXW[state.r];
  if (opt && !opt.classList.contains('is-active')) document.getElementById('maxw').dispatchEvent(new CustomEvent('segmented-set', { detail: { option: opt } }));
  swap();
});
document.getElementById('comp').addEventListener('picker-change', (e) => { state.comp = e.detail.value; render(); });
document.getElementById('maxw').addEventListener('segmented-change', (e) => { const v = Number(e.detail.value); if (v !== state.maxw) { state.maxw = v; render(); } });
document.getElementById('content').addEventListener('segmented-change', (e) => { state.content = Number(e.detail.value); swap(); });
document.getElementById('screen-size').addEventListener('segmented-change', (e) => { state.size = e.detail.value; fit(); render(); });
document.getElementById('show-space').addEventListener('segmented-change', (e) => { state.space = e.detail.value === 'on'; screen.classList.toggle('show-space', state.space); });
new ResizeObserver(() => { fit(); requestAnimationFrame(refresh); }).observe(stage);
fit();
render();
document.fonts?.ready.then(() => readout(REG[state.r], state.size === 'desktop' ? 1 : 0));

function summarise() {
  const ids = PROPOSALS.map((p) => p[0]);
  const by = (v) => ids.filter((id) => (decisions[id] || 'pending') === v);
  const a = by('approve'), dd = by('decline'), p = by('pending');
  document.getElementById('decision-summary').textContent = `${a.length} approved, ${dd.length} declined, ${p.length} to decide.`;
  document.getElementById('copy-decisions').dataset.copy = `Approve: ${a.join(', ') || 'none'}\nDecline: ${dd.join(', ') || 'none'}${p.length ? `\nUndecided: ${p.join(', ')}` : ''}`;
}
document.getElementById('proposals').addEventListener('segmented-change', (e) => {
  const item = e.target.closest('.proposal'); if (!item) return;
  decisions[item.dataset.id] = e.detail.value;
  try { localStorage.setItem('register-proposals', JSON.stringify(decisions)); } catch {}
  item.classList.toggle('is-declined', e.detail.value === 'decline');
  summarise();
});
summarise();
</script>
</body>
</html>
